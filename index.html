  <title>เป๋าตุง — Canva Port</title>
  <style>
:root {
  --bg: #f4f8f7;
  --surface: #ffffff;
  --surface-2: #f7faf9;
  --surface-3: #eef5f3;
  --ink: #14231f;
  --muted: #687a74;
  --subtle: #90a09b;
  --line: #dfe9e6;
  --mint-50: #edfff9;
  --mint-100: #d8f8ed;
  --mint-200: #b1efda;
  --mint-300: #7adfc1;
  --mint-400: #3fc7a1;
  --mint-500: #19a982;
  --mint-600: #0b8a69;
  --mint-700: #087057;
  --mint-800: #075747;
  --mint-900: #073f35;
  --amber: #f59e0b;
  --orange: #f97316;
  --red: #ef4444;
  --blue: #3b82f6;
  --violet: #8b5cf6;
  --shadow-sm: 0 4px 18px rgba(18, 62, 50, 0.07);
  --shadow-md: 0 18px 50px rgba(18, 62, 50, 0.12);
  --shadow-lg: 0 30px 80px rgba(8, 57, 45, 0.2);
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 26px;
  --radius-xl: 34px;
}

:root[data-theme="dark"] {
  --bg: #07110f;
  --surface: #0d1b18;
  --surface-2: #11221e;
  --surface-3: #172b26;
  --ink: #edf9f5;
  --muted: #9cb3ab;
  --subtle: #6f8880;
  --line: #213a34;
  --mint-50: #102a24;
  --mint-100: #15372e;
  --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.24);
  --shadow-md: 0 18px 50px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 30px 80px rgba(0, 0, 0, 0.5);
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-geist-sans), "Noto Sans Thai", "Tahoma", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}

button,
input,
select,
textarea {
  color: inherit;
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

input,
select,
textarea {
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--mint-500) !important;
  box-shadow: 0 0 0 3px rgba(25, 169, 130, 0.13);
}

img {
  max-width: 100%;
}

h1,
h2,
h3,
h4,
p {
  margin: 0;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.button {
  min-height: 46px;
  border-radius: 14px;
  padding: 0 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  font-weight: 700;
  transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
}

.button:hover {
  transform: translateY(-1px);
}

.button.primary {
  color: white;
  background: var(--mint-600);
  box-shadow: 0 9px 25px rgba(11, 138, 105, 0.23);
}

.button.primary:hover {
  background: var(--mint-700);
}

.button.secondary {
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
}

.button.ghost {
  min-height: 40px;
  background: transparent;
  color: var(--muted);
}

.button.glass {
  min-height: 42px;
  color: white;
  background: rgba(255, 255, 255, 0.13);
  border: 1px solid rgba(255, 255, 255, 0.24);
  backdrop-filter: blur(10px);
}

.button.small {
  min-height: 38px;
  border-radius: 11px;
  padding: 0 13px;
  font-size: 13px;
}

.button.danger-button {
  color: white;
  background: var(--red);
}

.full-button {
  width: 100%;
}

.text-danger,
.negative {
  color: var(--red) !important;
}

.text-button {
  padding: 7px 0;
  background: transparent;
  color: var(--mint-600);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 700;
  font-size: 13px;
}

.icon-button {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  transition: background 180ms ease, transform 180ms ease;
}

.icon-button:hover {
  background: var(--mint-50);
  transform: translateY(-1px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 15px 15px 15px 6px;
  display: grid;
  place-items: center;
  color: white;
  background: linear-gradient(145deg, var(--mint-400), var(--mint-700));
  box-shadow: 0 9px 22px rgba(11, 138, 105, 0.24);
  transform: rotate(-3deg);
}

.brand-mark span {
  font-size: 21px;
  font-weight: 900;
  transform: rotate(3deg);
}

.brand-copy {
  display: flex;
  flex-direction: column;
}

.brand-copy strong {
  font-size: 20px;
  line-height: 1.05;
  letter-spacing: -0.5px;
}

.brand-copy small {
  margin-top: 3px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
}

.simulation-badge {
  width: fit-content;
  padding: 5px 9px;
  color: var(--mint-700);
  background: var(--mint-100);
  border: 1px solid var(--mint-200);
  border-radius: 999px;
  font-size: 10px;
  line-height: 1;
  font-weight: 800;
  white-space: nowrap;
}

.simulation-badge.subtle {
  padding: 4px 7px;
  color: var(--muted);
  background: var(--surface-3);
  border-color: var(--line);
  font-size: 9px;
}

.status-badge {
  width: fit-content;
  min-height: 30px;
  padding: 0 10px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 800;
  color: white;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #8fffd6;
  box-shadow: 0 0 0 4px rgba(143, 255, 214, 0.12);
}

.status-badge.caution .status-dot {
  background: #fde68a;
}

.status-badge.near .status-dot {
  background: #fdba74;
}

.status-badge.danger .status-dot {
  background: #fecaca;
}

.loading-screen {
  min-height: 100dvh;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 16px;
  background: radial-gradient(circle at 50% 40%, var(--mint-100), var(--bg) 45%);
}

.loader-logo {
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  color: white;
  background: linear-gradient(145deg, var(--mint-400), var(--mint-700));
  border-radius: 24px 24px 24px 8px;
  box-shadow: var(--shadow-md);
  font-size: 31px;
  font-weight: 900;
  animation: loader-breathe 1.6s ease-in-out infinite;
}

.loading-dots {
  display: flex;
  gap: 6px;
}

.loading-dots span {
  width: 7px;
  height: 7px;
  background: var(--mint-500);
  border-radius: 50%;
  animation: dot-hop 1s ease-in-out infinite;
}

.loading-dots span:nth-child(2) { animation-delay: 0.15s; }
.loading-dots span:nth-child(3) { animation-delay: 0.3s; }
.loading-screen p { color: var(--muted); font-size: 13px; }

@keyframes loader-breathe {
  50% { transform: translateY(-5px) rotate(-2deg); }
}

@keyframes dot-hop {
  50% { transform: translateY(-5px); opacity: 0.5; }
}

/* Welcome */

.welcome-page {
  min-height: 100dvh;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 10% 10%, rgba(122, 223, 193, 0.24), transparent 32%),
    radial-gradient(circle at 90% 25%, rgba(25, 169, 130, 0.14), transparent 30%),
    linear-gradient(180deg, #f9fffd 0%, var(--bg) 100%);
}

:root[data-theme="dark"] .welcome-page {
  background:
    radial-gradient(circle at 10% 10%, rgba(25, 169, 130, 0.16), transparent 32%),
    radial-gradient(circle at 90% 25%, rgba(25, 169, 130, 0.11), transparent 30%),
    var(--bg);
}

.welcome-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(2px);
  pointer-events: none;
}

.orb-one {
  width: 360px;
  height: 360px;
  left: -230px;
  top: 36%;
  background: rgba(63, 199, 161, 0.11);
}

.orb-two {
  width: 260px;
  height: 260px;
  right: -170px;
  bottom: 5%;
  background: rgba(59, 130, 246, 0.08);
}

.welcome-shell {
  width: min(1120px, calc(100% - 36px));
  margin: 0 auto;
  padding: 24px 0 34px;
  position: relative;
  z-index: 1;
}

.welcome-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.welcome-grid {
  min-height: calc(100dvh - 220px);
  padding: 46px 0 36px;
  display: grid;
  grid-template-columns: 1.02fr 0.98fr;
  align-items: center;
  gap: 72px;
}

.welcome-copy {
  max-width: 570px;
}

.kicker {
  width: fit-content;
  padding: 7px 11px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--mint-700);
  background: var(--mint-100);
  border: 1px solid var(--mint-200);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
}

.welcome-copy h1 {
  margin-top: 19px;
  font-size: clamp(42px, 5vw, 72px);
  line-height: 1.1;
  letter-spacing: -2.7px;
}

.welcome-copy h1 span {
  display: inline-block;
  margin-left: 10px;
  color: var(--mint-600);
}

.welcome-copy > p {
  max-width: 530px;
  margin-top: 22px;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.85;
}

.welcome-cta {
  min-height: 56px;
  margin-top: 28px;
  padding: 0 24px;
  border-radius: 17px;
  font-size: 16px;
}

.trust-note {
  margin-top: 18px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
}

.trust-note svg {
  flex: 0 0 auto;
  margin-top: 1px;
  color: var(--mint-600);
}

.welcome-visual {
  min-height: 560px;
  position: relative;
  display: grid;
  place-items: center;
}

.phone-preview {
  width: 305px;
  min-height: 548px;
  padding: 17px;
  position: relative;
  overflow: hidden;
  border: 8px solid #17362e;
  border-radius: 42px;
  background: #f6faf8;
  box-shadow: 0 42px 85px rgba(10, 66, 52, 0.25);
  transform: rotate(2deg);
}

:root[data-theme="dark"] .phone-preview {
  background: #0d1b18;
}

.phone-top {
  height: 18px;
  display: flex;
  justify-content: space-between;
}

.phone-top span:first-child {
  width: 62px;
  height: 12px;
  margin: -5px auto 0;
  border-radius: 20px;
  background: #17362e;
}

.preview-greeting {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
}

.preview-greeting div {
  display: flex;
  flex-direction: column;
}

.preview-greeting small { color: var(--muted); font-size: 9px; }
.preview-greeting strong { font-size: 15px; }

.preview-avatar {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: white;
  background: var(--mint-600);
  font-size: 12px;
  font-weight: 800;
}

.preview-wallet {
  margin-top: 15px;
  padding: 19px;
  border-radius: 23px;
  color: white;
  background: linear-gradient(145deg, #0ea47c, #075747);
  box-shadow: 0 14px 30px rgba(8, 112, 87, 0.25);
}

.preview-wallet > span { font-size: 10px; opacity: 0.78; }
.preview-wallet > strong { display: block; margin-top: 4px; font-size: 27px; letter-spacing: -1px; }
.preview-wallet > small { display: block; margin-top: 7px; opacity: 0.72; font-size: 8px; }

.preview-progress {
  height: 5px;
  margin-top: 14px;
  overflow: hidden;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.15);
}

.preview-progress i {
  width: 55%;
  height: 100%;
  display: block;
  border-radius: 10px;
  background: #94ffdc;
}

.preview-stats {
  margin-top: 13px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.preview-stats span {
  padding: 13px;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
}

.preview-stats small { color: var(--muted); font-size: 8px; }
.preview-stats strong { margin-top: 4px; color: var(--ink); font-size: 15px; }

.preview-insight {
  margin-top: 10px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: 15px;
  background: #fff8df;
}

:root[data-theme="dark"] .preview-insight { background: #332b13; }

.preview-insight > span {
  width: 33px;
  height: 33px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: white;
}

.preview-insight p { display: flex; flex-direction: column; }
.preview-insight strong { font-size: 10px; }
.preview-insight small { color: #8b733d; font-size: 8px; }

.preview-bars {
  height: 122px;
  margin-top: 19px;
  padding: 10px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--surface);
}

.preview-bars i {
  flex: 1;
  min-height: 7px;
  border-radius: 7px 7px 3px 3px;
  background: linear-gradient(180deg, var(--mint-300), var(--mint-600));
}

.floating-chip {
  min-width: 185px;
  padding: 12px 14px;
  position: absolute;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 17px;
  background: rgba(255, 255, 255, 0.88);
  box-shadow: var(--shadow-md);
  backdrop-filter: blur(14px);
  animation: chip-float 4s ease-in-out infinite;
}

:root[data-theme="dark"] .floating-chip {
  background: rgba(17, 34, 30, 0.9);
  border-color: var(--line);
}

.floating-chip > span {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: white;
  background: var(--mint-500);
  border-radius: 11px;
  font-weight: 900;
}

.floating-chip p { display: flex; flex-direction: column; }
.floating-chip strong { font-size: 11px; }
.floating-chip small { color: var(--muted); font-size: 9px; }
.chip-budget { left: 4%; top: 24%; }
.chip-alert { right: -1%; bottom: 16%; animation-delay: 1.3s; }
.chip-alert > span { background: var(--amber); }

@keyframes chip-float {
  50% { transform: translateY(-7px); }
}

.welcome-features {
  padding: 18px 22px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.7);
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(12px);
}

:root[data-theme="dark"] .welcome-features { background: rgba(13, 27, 24, 0.75); }

.welcome-features article {
  padding: 9px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.welcome-features article + article { border-left: 1px solid var(--line); }

.welcome-features article > span {
  width: 39px;
  height: 39px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  color: var(--mint-700);
  background: var(--mint-100);
  border-radius: 13px;
}

.welcome-features p { display: flex; flex-direction: column; }
.welcome-features strong { font-size: 12px; }
.welcome-features small { color: var(--muted); font-size: 10px; }

/* Setup */

.setup-page {
  min-height: 100dvh;
  background:
    radial-gradient(circle at 0 0, rgba(122, 223, 193, 0.17), transparent 30%),
    var(--bg);
}

.setup-page.embedded {
  min-height: auto;
  background: transparent;
}

.setup-topbar {
  width: min(1040px, calc(100% - 32px));
  margin: 0 auto;
  padding: 21px 0;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
}

.setup-topbar .icon-button svg { transform: rotate(180deg); }
.setup-topbar .simulation-badge { justify-self: end; }

.setup-layout {
  width: min(1040px, calc(100% - 32px));
  margin: 0 auto;
  padding: 38px 0 70px;
  display: grid;
  grid-template-columns: 0.85fr 1.15fr;
  align-items: start;
  gap: 62px;
}

.embedded .setup-layout {
  width: 100%;
  padding: 0;
  grid-template-columns: 0.76fr 1.24fr;
  gap: 34px;
}

.setup-copy {
  padding-top: 48px;
  position: sticky;
  top: 20px;
}

.embedded .setup-copy { padding: 28px 0; }

.step-pill {
  width: fit-content;
  padding: 6px 10px;
  color: var(--mint-700);
  background: var(--mint-100);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
}

.setup-copy h1 {
  margin-top: 17px;
  font-size: clamp(31px, 4vw, 48px);
  line-height: 1.2;
  letter-spacing: -1.4px;
}

.embedded .setup-copy h1 { font-size: 32px; }

.setup-copy > p {
  margin-top: 16px;
  color: var(--muted);
  line-height: 1.8;
}

.logic-mini-flow {
  margin-top: 32px;
  display: flex;
  align-items: flex-start;
}

.logic-mini-flow > span {
  width: 38px;
  height: 38px;
  position: relative;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 50%;
  font-size: 12px;
  font-weight: 900;
}

.logic-mini-flow > span.active {
  color: white;
  background: var(--mint-600);
  border-color: var(--mint-600);
}

.logic-mini-flow > span small {
  width: 88px;
  position: absolute;
  top: 45px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--muted);
  text-align: center;
  font-size: 10px;
  font-weight: 600;
}

.logic-mini-flow i {
  width: 58px;
  height: 2px;
  margin-top: 18px;
  background: var(--line);
}

.setup-card {
  padding: 30px;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: var(--surface);
  box-shadow: var(--shadow-md);
}

.form-heading {
  margin-bottom: 25px;
  display: flex;
  align-items: center;
  gap: 13px;
}

.form-icon {
  width: 45px;
  height: 45px;
  display: grid;
  place-items: center;
  color: var(--mint-700);
  background: var(--mint-100);
  border-radius: 15px;
}

.form-heading h2 { font-size: 20px; }
.form-heading p { margin-top: 2px; color: var(--muted); font-size: 12px; }

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.field + .field,
.form-row + .field,
.field + .form-row {
  margin-top: 17px;
}

.field > span {
  font-size: 12px;
  font-weight: 800;
}

.field > input,
.field > select,
.field > textarea,
.input-with-icon,
.money-input,
.suffix-input,
.history-filters input,
.history-filters select,
.scan-result-form input,
.scan-result-form select {
  width: 100%;
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface-2);
}

.field > input,
.field > select,
.field > textarea,
.scan-result-form input,
.scan-result-form select {
  padding: 0 13px;
}

.field > textarea {
  min-height: 82px;
  padding-top: 12px;
  resize: vertical;
}

.input-with-icon,
.money-input,
.suffix-input {
  display: flex;
  align-items: center;
  overflow: hidden;
}

.input-with-icon > svg {
  margin-left: 13px;
  flex: 0 0 auto;
  color: var(--muted);
}

.input-with-icon input,
.money-input input,
.suffix-input input {
  width: 100%;
  min-width: 0;
  height: 46px;
  padding: 0 12px;
  border: 0;
  background: transparent;
  box-shadow: none !important;
}

.input-with-icon:focus-within,
.money-input:focus-within,
.suffix-input:focus-within {
  border-color: var(--mint-500);
  box-shadow: 0 0 0 3px rgba(25, 169, 130, 0.13);
}

.input-with-icon input:focus,
.input-with-icon input:focus-visible,
.money-input input:focus,
.money-input input:focus-visible,
.suffix-input input:focus,
.suffix-input input:focus-visible {
  outline: 0 !important;
  border: 0 !important;
  box-shadow: none !important;
}

.money-input b {
  height: 32px;
  padding: 0 12px;
  display: grid;
  place-items: center;
  color: var(--mint-700);
  border-right: 1px solid var(--line);
  font-size: 17px;
}

.suffix-input b {
  padding-right: 13px;
  color: var(--muted);
  font-size: 12px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
}

.field-hint {
  color: var(--mint-600);
  font-size: 10px;
}

.plan-preview {
  margin-top: 22px;
  padding: 15px;
  display: grid;
  grid-template-columns: 1fr auto 1fr auto 1.25fr;
  align-items: center;
  gap: 9px;
  border-radius: 17px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}

.plan-preview div {
  display: flex;
  flex-direction: column;
}

.plan-preview span { color: var(--muted); font-size: 9px; }
.plan-preview strong { margin-top: 3px; font-size: 13px; }
.plan-preview > i { color: var(--subtle); font-style: normal; }
.plan-preview .highlight {
  padding: 10px;
  border-radius: 12px;
  background: var(--mint-100);
}

.plan-preview .highlight strong { color: var(--mint-700); }

.demo-toggle {
  margin-top: 18px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 11px;
  border: 1px solid var(--line);
  border-radius: 16px;
  cursor: pointer;
}

.demo-toggle > input {
  position: absolute;
  opacity: 0;
}

.toggle-ui,
.switch {
  width: 42px;
  height: 24px;
  flex: 0 0 auto;
  padding: 3px;
  border-radius: 999px;
  background: var(--line);
  transition: background 180ms ease;
}

.toggle-ui::after,
.switch i {
  content: "";
  width: 18px;
  height: 18px;
  display: block;
  border-radius: 50%;
  background: white;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.16);
  transition: transform 180ms ease;
}

.demo-toggle > input:checked + .toggle-ui,
.switch.on {
  background: var(--mint-500);
}

.demo-toggle > input:checked + .toggle-ui::after,
.switch.on i {
  transform: translateX(18px);
}

.demo-toggle p {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.demo-toggle strong { font-size: 12px; }
.demo-toggle small { margin-top: 2px; color: var(--muted); font-size: 9px; }

.notice-strip {
  padding: 12px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border-radius: 14px;
  font-size: 11px;
  line-height: 1.65;
}

.notice-strip > span {
  margin-top: 1px;
  flex: 0 0 auto;
}

.notice-strip strong { display: block; font-size: 12px; }
.notice-strip p { margin-top: 2px; }
.notice-strip.mint { color: #087057; background: #e6fbf4; border: 1px solid #bfefdf; }
.notice-strip.amber { color: #8a5a05; background: #fff8e3; border: 1px solid #f8e3a5; }
.notice-strip.red { color: #a52727; background: #fff0f0; border: 1px solid #ffd0d0; }
.notice-strip.blue { color: #24558e; background: #eef6ff; border: 1px solid #cfe4ff; }

:root[data-theme="dark"] .notice-strip.mint { color: #8cf4d3; background: #0d3027; border-color: #195341; }
:root[data-theme="dark"] .notice-strip.amber { color: #f8d987; background: #302814; border-color: #59471c; }
:root[data-theme="dark"] .notice-strip.red { color: #ffaaaa; background: #32191a; border-color: #5e282a; }
:root[data-theme="dark"] .notice-strip.blue { color: #9bc6fa; background: #14263a; border-color: #244567; }

.setup-card > .notice-strip { margin-top: 18px; }

.setup-actions {
  margin-top: 22px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.error-summary {
  margin-bottom: 18px;
  padding: 12px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  color: #a52727;
  background: #fff0f0;
  border: 1px solid #ffd0d0;
  border-radius: 14px;
}

.error-summary > svg { flex: 0 0 auto; margin-top: 1px; }
.error-summary strong { display: block; font-size: 12px; }
.error-summary p { margin-top: 2px; font-size: 10px; }

/* App shell */

.app-background {
  min-height: 100dvh;
  background:
    radial-gradient(circle at 15% -10%, rgba(63, 199, 161, 0.13), transparent 28%),
    var(--bg);
}

.app-shell {
  width: min(1120px, 100%);
  min-height: 100dvh;
  margin: 0 auto;
  position: relative;
  background: var(--bg);
}

.app-header {
  height: 78px;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(223, 233, 230, 0.78);
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter: blur(18px);
}

:root[data-theme="dark"] .app-header { border-color: rgba(33, 58, 52, 0.8); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.notification-button { position: relative; }
.notification-button i {
  width: 7px;
  height: 7px;
  position: absolute;
  right: 9px;
  top: 8px;
  border: 2px solid var(--surface-2);
  border-radius: 50%;
  background: var(--red);
}

.screen-content {
  min-height: calc(100dvh - 78px);
  padding: 24px 24px 112px;
}

.page-stack {
  display: flex;
  flex-direction: column;
  gap: 20px;
  animation: page-in 280ms ease both;
}

@keyframes page-in {
  from { opacity: 0; transform: translateY(5px); }
}

.page-intro {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
}

.page-intro > div > p,
.section-kicker {
  color: var(--mint-600);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.04em;
}

.page-intro h1 {
  margin-top: 2px;
  font-size: 28px;
  letter-spacing: -0.8px;
}

.page-intro > div > span {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
}

.add-fab {
  min-height: 44px;
  padding: 0 16px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: white;
  background: var(--mint-600);
  border-radius: 14px;
  font-weight: 800;
}

.mobile-add-fab {
  display: none;
}

.card {
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.card-heading,
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.card-heading h2,
.section-header h2 {
  margin-top: 2px;
  font-size: 18px;
  letter-spacing: -0.35px;
}

.section-header > small {
  color: var(--muted);
  font-size: 10px;
}

.completion-panel {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: stretch;
  gap: 10px;
}

.completion-panel > .button { height: auto; min-height: 64px; }

.completion-banner {
  width: 100%;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: #075747;
  text-align: left;
  background: linear-gradient(90deg, #d8f8ed, #edfff9);
  border: 1px solid #b1efda;
  border-radius: 17px;
}

.completion-banner > span {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  color: white;
  background: var(--mint-600);
  border-radius: 12px;
}

.completion-banner p { flex: 1; display: flex; flex-direction: column; }
.completion-banner small { margin-top: 2px; color: #47766a; font-size: 10px; }

.balance-hero {
  min-height: 245px;
  padding: 26px;
  position: relative;
  overflow: hidden;
  color: white;
  border-radius: var(--radius-xl);
  background: linear-gradient(145deg, #0fa77e, #075747 72%);
  box-shadow: 0 22px 48px rgba(8, 112, 87, 0.24);
}

.balance-hero.caution { background: linear-gradient(145deg, #bc8513, #79520b 75%); }
.balance-hero.near { background: linear-gradient(145deg, #db7319, #8c3e09 75%); }
.balance-hero.danger { background: linear-gradient(145deg, #dd4444, #842626 75%); }

.hero-top,
.hero-foot,
.hero-progress {
  position: relative;
  z-index: 2;
}

.hero-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 15px;
}

.hero-top > div {
  display: flex;
  flex-direction: column;
}

.hero-top > div > span {
  opacity: 0.76;
  font-size: 12px;
}

.hero-top > div > strong {
  margin-top: 4px;
  font-size: clamp(38px, 6vw, 54px);
  line-height: 1.1;
  letter-spacing: -2px;
}

.hero-top > div > strong.negative { color: #fff1f1 !important; }

.hero-progress {
  margin-top: 31px;
}

.hero-progress > div {
  height: 8px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.16);
  border-radius: 999px;
}

.hero-progress > div > span {
  height: 100%;
  display: block;
  background: linear-gradient(90deg, #87ffdc, #d2fff0);
  border-radius: inherit;
  transition: width 500ms ease;
}

.hero-progress > p {
  margin-top: 8px;
  display: flex;
  justify-content: space-between;
  opacity: 0.72;
  font-size: 10px;
}

.hero-foot {
  margin-top: 24px;
  display: flex;
  gap: 20px;
}

.hero-foot span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 700;
}

.hero-pattern {
  width: 300px;
  height: 300px;
  position: absolute;
  right: -80px;
  top: -110px;
  border: 55px solid rgba(255, 255, 255, 0.035);
  border-radius: 50%;
}

.hero-pattern::after {
  content: "";
  width: 340px;
  height: 340px;
  position: absolute;
  right: -40px;
  top: 90px;
  border: 30px solid rgba(255, 255, 255, 0.025);
  border-radius: 50%;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.percent-chip {
  min-width: 47px;
  padding: 6px 8px;
  text-align: center;
  border-radius: 999px;
  color: var(--mint-700);
  background: var(--mint-100);
  font-size: 11px;
  font-weight: 900;
}

.percent-chip.caution { color: #8a5a05; background: #fff1bf; }
.percent-chip.near { color: #9a430b; background: #ffdfc4; }
.percent-chip.danger { color: #a52727; background: #ffdada; }

.today-ring-row {
  margin-top: 20px;
  display: grid;
  grid-template-columns: 142px 1fr;
  align-items: center;
  gap: 24px;
}

.progress-ring {
  width: 142px;
  height: 142px;
  padding: 13px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--mint-500) var(--progress), var(--surface-3) 0);
}

.progress-ring::before {
  content: "";
  grid-area: 1 / 1;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--surface);
}

.progress-ring > div {
  grid-area: 1 / 1;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.progress-ring strong { font-size: 21px; }
.progress-ring small { margin-top: 2px; color: var(--muted); font-size: 9px; }

.today-numbers {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.today-numbers span {
  display: flex;
  flex-direction: column;
}

.today-numbers small { color: var(--muted); font-size: 9px; }
.today-numbers strong { margin-top: 2px; font-size: 20px; }

.budget-threshold {
  height: 7px;
  margin-top: 20px;
  overflow: hidden;
  border-radius: 999px;
  background: linear-gradient(90deg, #9ce6c9 70%, #f9dc86 70% 90%, #ffc27f 90%);
}

.budget-threshold span {
  height: 100%;
  display: block;
  background: var(--mint-700);
  border-radius: inherit;
}

.budget-threshold.caution span { background: #c98b0e; }
.budget-threshold.near span { background: var(--orange); }
.budget-threshold.danger span { background: var(--red); }

.threshold-labels {
  margin-top: 5px;
  display: flex;
  justify-content: space-between;
  color: var(--subtle);
  font-size: 8px;
}

.insight-card {
  min-height: 100%;
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: auto 1fr;
  align-content: start;
  gap: 13px;
  background:
    radial-gradient(circle at 100% 0, rgba(63, 199, 161, 0.15), transparent 45%),
    var(--surface);
}

.insight-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  color: var(--mint-700);
  background: var(--mint-100);
  border-radius: 15px;
}

.insight-card h2 { margin-top: 3px; font-size: 20px; }
.insight-card p { margin-top: 10px; color: var(--muted); line-height: 1.75; font-size: 12px; }

.forecast-row {
  grid-column: 1 / -1;
  margin-top: 18px;
  padding-top: 18px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 15px;
  border-top: 1px solid var(--line);
}

.forecast-row > span {
  display: flex;
  flex-direction: column;
}

.forecast-row small { color: var(--muted); font-size: 9px; }
.forecast-row strong { margin-top: 2px; font-size: 20px; }
.forecast-row button {
  padding: 6px 0;
  display: inline-flex;
  align-items: center;
  color: var(--mint-600);
  background: transparent;
  font-size: 10px;
  font-weight: 800;
}

.quick-section {
  padding: 6px 0;
}

.quick-grid {
  margin-top: 13px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.quick-grid button {
  min-height: 92px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 11px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: transform 180ms ease, border 180ms ease;
}

.quick-grid button:hover {
  transform: translateY(-2px);
  border-color: var(--mint-300);
}

.quick-icon,
.metric-icon {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 14px;
}

.quick-icon.mint, .metric-icon.mint { color: #087057; background: #d8f8ed; }
.quick-icon.amber, .metric-icon.amber { color: #9a6506; background: #fff0bd; }
.quick-icon.blue, .metric-icon.blue { color: #2867ae; background: #deedff; }
.quick-icon.violet, .metric-icon.violet { color: #6d42ba; background: #eee5ff; }
.metric-icon.rose { color: #b53270; background: #ffe2ef; }
.metric-icon.red { color: #b62f2f; background: #ffe1e1; }

.quick-grid p { display: flex; flex-direction: column; min-width: 0; }
.quick-grid strong { font-size: 12px; }
.quick-grid small { margin-top: 3px; color: var(--muted); font-size: 9px; }

.lower-grid {
  grid-template-columns: 1.25fr 0.75fr;
}

.legend-dot {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-size: 9px;
}

.legend-dot i {
  width: 18px;
  height: 2px;
  background: var(--amber);
}

.mini-chart {
  height: 240px;
  margin-top: 19px;
}

.chart-plot {
  height: 100%;
  position: relative;
  display: flex;
  align-items: stretch;
  justify-content: space-around;
  gap: 8px;
  border-bottom: 1px solid var(--line);
}

.chart-plot::before,
.chart-plot::after {
  content: "";
  width: 100%;
  position: absolute;
  left: 0;
  border-top: 1px dashed var(--line);
}

.chart-plot::before { top: 30%; }
.chart-plot::after { top: 62%; }

.limit-line {
  width: 100%;
  position: absolute;
  left: 0;
  z-index: 2;
  border-top: 1px dashed var(--amber);
}

.limit-line span {
  padding: 2px 5px;
  position: absolute;
  right: 0;
  top: -18px;
  color: #986305;
  background: #fff6d8;
  border-radius: 5px;
  font-size: 8px;
}

.bar-column {
  width: 100%;
  height: calc(100% - 26px);
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
}

.bar-value {
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 8px;
}

.bar-track {
  width: min(32px, 70%);
  height: 86%;
  display: flex;
  align-items: flex-end;
  border-radius: 9px 9px 3px 3px;
  background: rgba(25, 169, 130, 0.05);
}

.bar-fill {
  width: 100%;
  min-height: 3px;
  border-radius: 9px 9px 3px 3px;
  background: linear-gradient(180deg, var(--mint-300), var(--mint-600));
  transition: height 500ms ease;
}

.bar-fill.over {
  background: linear-gradient(180deg, #ff9c9c, var(--red));
}

.bar-label {
  height: 25px;
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 2px;
  color: var(--muted);
  font-size: 8px;
}

.bar-label small { color: var(--subtle); font-size: 7px; }

.category-summary {
  margin-top: 21px;
  display: flex;
  align-items: center;
  gap: 17px;
}

.category-donut {
  width: 112px;
  height: 112px;
  padding: 12px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--category-color) var(--category-progress), var(--surface-3) 0);
}

.category-donut::before {
  content: "";
  grid-area: 1 / 1;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--surface);
}

.category-donut span {
  grid-area: 1 / 1;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 20px;
  font-weight: 900;
}

.category-donut small { color: var(--muted); font-size: 8px; font-weight: 600; }
.category-summary > div:last-child { display: flex; flex-direction: column; }
.category-summary > div:last-child > small { color: var(--muted); font-size: 9px; }
.category-summary > div:last-child > strong { margin-top: 3px; font-size: 14px; }
.category-summary > div:last-child > p { margin-top: 3px; color: var(--mint-600); font-weight: 800; }

.category-bars {
  margin-top: 21px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.category-bars > div > p {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
}

.category-bars > div > p strong { font-size: 9px; }
.category-bars > div > i {
  height: 5px;
  margin-top: 5px;
  display: block;
  overflow: hidden;
  border-radius: 10px;
  background: var(--surface-3);
}

.category-bars > div > i > span {
  height: 100%;
  display: block;
  border-radius: 10px;
}

.recent-card {
  padding-bottom: 9px;
}

.expense-list {
  margin-top: 13px;
  display: flex;
  flex-direction: column;
}

.expense-row {
  min-height: 70px;
  padding: 12px 3px;
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: 12px;
  border-top: 1px solid var(--line);
}

.expense-list .expense-row:first-child { border-top: 0; }

.expense-category-icon {
  width: 43px;
  height: 43px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 14px;
  font-size: 20px;
}

.expense-main {
  min-width: 0;
}

.expense-main > p {
  display: flex;
  align-items: center;
  gap: 7px;
}

.expense-main strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
}

.expense-main > small {
  display: block;
  margin-top: 3px;
  overflow: hidden;
  color: var(--muted);
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 9px;
}

.expense-amount {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.expense-amount strong { font-size: 12px; }
.expense-amount small { margin-top: 3px; color: var(--muted); font-size: 8px; }

.row-actions {
  display: flex;
  gap: 5px;
}

.row-actions button {
  width: 32px;
  height: 32px;

/* Budget */

.plan-overview-top > div > .simulation-badge {

.segment-control,

.history-card { padding: 22px; }

.search-field {

.metric-card {

.metric-card > small { color: var(--muted); font-size: 9px; }

.insight-list {

.summary-button { align-self: center; }

/* Stores */

}

.location-feedback {

.mock-map {

    linear-gradient(22deg, transparent 47%, rgba(255, 255, 255, 0.85) 47% 51%, transparent 51%),
    linear-gradient(105deg, transparent 48%, rgba(255, 255, 255, 0.75) 48% 52%, transparent 52%),

.map-budget-chip {

.map-budget-chip svg { color: var(--mint-600); }

.restaurant-section {

}

.restaurant-info {

.restaurant-info > div:first-child {

.budget-fit,

}

.sample-slip-grid {
  margin-top: 14px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.sample-slip {
  padding: 8px;
  position: relative;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.sample-slip.active {
  border-color: var(--mint-400);
  box-shadow: 0 0 0 3px rgba(25, 169, 130, 0.12);
}

.sample-slip img {
  width: 100%;
  height: 116px;
  object-fit: cover;
  object-position: top;
  border-radius: 10px;
  background: #f7f7f7;
}

.sample-slip > span {
  margin-top: 6px;
  display: flex;
  flex-direction: column;
}

.sample-slip strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 9px;
}

.sample-slip small { color: var(--mint-600); font-size: 9px; }
.sample-slip .simulation-badge { margin-top: 5px; }

.qr-camera {
  min-height: 280px;
  margin-top: 17px;
  position: relative;
  overflow: hidden;
  display: grid;
  place-items: center;
  border-radius: 22px;
  background:
    radial-gradient(circle, rgba(122, 223, 193, 0.18), transparent 45%),
    #102a25;
}

.qr-camera::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.18;
  background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
  background-size: 22px 22px;
}

.qr-camera > p {
  position: absolute;
  bottom: 16px;
  color: rgba(255, 255, 255, 0.65);
  font-size: 9px;
}

.scan-corners {
  width: 180px;
  height: 180px;
  position: absolute;
  z-index: 3;
}

.scan-corners i {
  width: 35px;
  height: 35px;
  position: absolute;
  border-color: #67e8bd;
  border-style: solid;
}

.scan-corners i:nth-child(1) { left: 0; top: 0; border-width: 3px 0 0 3px; border-radius: 10px 0 0; }
.scan-corners i:nth-child(2) { right: 0; top: 0; border-width: 3px 3px 0 0; border-radius: 0 10px 0 0; }
.scan-corners i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 10px; }
.scan-corners i:nth-child(4) { right: 0; bottom: 0; border-width: 0 3px 3px 0; border-radius: 0 0 10px; }

.qr-pattern {
  width: 130px;
  height: 130px;
  padding: 8px;
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  border-radius: 9px;
  background: white;
}

.qr-pattern i { border-radius: 1px; background: white; }
.qr-pattern i.on { background: #102a25; }
.qr-pattern.small { width: 48px; height: 48px; padding: 4px; gap: 1px; border: 1px solid var(--line); border-radius: 7px; }

.scan-line {
  width: 156px;
  height: 2px;
  position: absolute;
  z-index: 5;
  top: calc(50% - 76px);
  background: #71f6cb;
  box-shadow: 0 0 11px #71f6cb;
  animation: scan-move 1.4s ease-in-out infinite;
}

@keyframes scan-move {
  50% { transform: translateY(150px); }
}

.spinner {
  width: 17px;
  height: 17px;
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.qr-sample-list {
  margin-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.qr-sample-list > button {
  min-height: 72px;
  padding: 10px;
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: 10px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.qr-sample-list > button > span:nth-child(2) {
  display: flex;
  flex-direction: column;
}

.qr-sample-list strong { font-size: 11px; }
.qr-sample-list small { margin-top: 2px; color: var(--muted); font-size: 8px; }
.qr-sample-list > button > svg { color: var(--subtle); }

.scan-result-card {
  animation: result-in 280ms ease both;
}

@keyframes result-in {
  from { opacity: 0; transform: translateY(8px); }
}

.result-success {
  display: flex;
  align-items: center;
  gap: 11px;
}

.result-success > span {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  color: white;
  background: var(--mint-600);
  border-radius: 14px;
}

.result-success > div { flex: 1; }
.result-success h2 { font-size: 16px; }
.result-success p { margin-top: 2px; color: var(--muted); font-size: 9px; }

.scan-result-form {
  margin-top: 19px;
}

.scan-result-form .form-row { margin-top: 16px; }
.scan-result-form .field + .field { margin-top: 0; }

/* Profile */

.profile-hero {
  padding: 24px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 15px;
  border-radius: 26px;
  color: white;
  background:
    radial-gradient(circle at 85% 0, rgba(255,255,255,.14), transparent 32%),
    linear-gradient(145deg, #138b6e, #064e3b);
  box-shadow: var(--shadow-md);
}

.profile-avatar {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  border: 3px solid rgba(255, 255, 255, 0.25);
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.14);
  font-size: 25px;
  font-weight: 900;
}

.profile-hero .simulation-badge { color: white; background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.2); }
.profile-hero h1 { margin-top: 5px; font-size: 25px; }
.profile-hero p { margin-top: 2px; opacity: 0.7; font-size: 10px; }
.local-profile { padding: 6px 9px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; background: rgba(255,255,255,.08); font-size: 9px; }

.profile-summary {
  padding: 18px;
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 18px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.profile-summary > div,
.profile-summary > span {
  display: flex;
  flex-direction: column;
}

.profile-summary small { color: var(--muted); font-size: 9px; }
.profile-summary strong { margin-top: 2px; font-size: 14px; }
.profile-summary .status-badge { color: var(--mint-700); background: var(--mint-100); border-color: var(--mint-200); }

.cycle-history-section {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.cycle-history-list { margin-top: 13px; display: grid; gap: 8px; }
.cycle-history-list article { padding: 11px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface-2); }
.cycle-history-list article > div { min-width: 0; display: flex; flex-direction: column; }
.cycle-history-list article > div strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.cycle-history-list article small { margin-top: 2px; color: var(--muted); font-size: 8px; }
.cycle-history-list article > span:last-child { align-items: flex-end; }
.cycle-history-list article b { color: var(--mint-700); font-size: 11px; }
.cycle-icon { width: 36px; height: 36px; display: grid; place-items: center; color: var(--mint-700); border-radius: 12px; background: var(--mint-100); }
.cycle-empty { margin-top: 12px; padding: 13px; color: var(--muted); border-radius: 14px; background: var(--surface-2); font-size: 10px; line-height: 1.6; }
.start-cycle-row { background: linear-gradient(90deg, var(--mint-50), var(--surface)); }
.start-cycle-row .setting-icon { color: white; background: var(--mint-600); }

.settings-group {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.settings-group > h2 {
  padding: 16px 17px 9px;
  color: var(--muted);
  font-size: 10px;
}

.setting-row {
  width: 100%;
  min-height: 72px;
  padding: 13px 17px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  border-top: 1px solid var(--line);
  background: transparent;
}

.setting-row.static { cursor: default; }
.setting-icon {
  width: 39px;
  height: 39px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  color: var(--mint-700);
  background: var(--mint-100);
  border-radius: 13px;
}

.setting-row p {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.setting-row strong { font-size: 12px; }
.setting-row small { margin-top: 2px; color: var(--muted); font-size: 9px; }
.setting-row > svg { color: var(--subtle); }
.danger-row .setting-icon { color: var(--red); background: #fff0f0; }
.danger-row strong { color: var(--red); }
.safe-label { padding: 5px 8px; color: var(--mint-700); background: var(--mint-100); border-radius: 999px; font-size: 9px; font-weight: 800; }

.scope-card {
  padding: 19px;
  display: flex;
  align-items: flex-start;
  gap: 13px;
  border: 1px solid var(--mint-200);
  border-radius: 20px;
  background: var(--mint-50);
}

.scope-icon {
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  color: white;
  background: var(--mint-600);
  border-radius: 13px;
}

.scope-card h2 { font-size: 14px; }
.scope-card p { margin-top: 4px; color: var(--muted); line-height: 1.7; font-size: 10px; }

.privacy-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.privacy-grid span {
  padding: 11px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  font-size: 9px;
}

.privacy-grid svg { color: var(--mint-600); }
.version-note { color: var(--subtle); text-align: center; font-size: 9px; }

/* Modals, dialogs, editors */

.modal-layer,
.dialog-layer {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  align-items: end;
  justify-items: center;
}

.modal-backdrop,
.dialog-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(4, 18, 14, 0.58);
  backdrop-filter: blur(5px);
}

.modal-sheet {
  width: min(640px, 100%);
  max-height: calc(100dvh - 24px);
  padding: 0;
  position: relative;
  z-index: 1;
  overflow: hidden;
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 28px 28px 0 0;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  animation: sheet-up 250ms ease both;
}

.modal-sheet.modal-large {
  width: min(850px, 100%);
}

@keyframes sheet-up {
  from { transform: translateY(40px); opacity: 0; }
}

.modal-handle {
  width: 42px;
  height: 4px;
  margin: 9px auto 2px;
  border-radius: 10px;
  background: var(--line);
}

.modal-header {
  padding: 15px 22px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}

.eyebrow {
  color: var(--mint-600);
  font-size: 9px;
  font-weight: 800;
}

.modal-header h2 { margin-top: 2px; font-size: 20px; }
.modal-content {
  max-height: calc(100dvh - 110px);
  padding: 22px;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.dialog-layer {
  z-index: 130;
  place-items: center;
  padding: 16px;
}

.confirm-dialog {
  width: min(430px, 100%);
  padding: 25px;
  position: relative;
  z-index: 1;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 26px;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  animation: dialog-pop 220ms ease both;
}

@keyframes dialog-pop {
  from { opacity: 0; transform: scale(0.95); }
}

.dialog-icon {
  width: 54px;
  height: 54px;
  margin: 0 auto;
  display: grid;
  place-items: center;
  border-radius: 18px;
}

.dialog-icon.warning { color: #9a6506; background: #fff0bd; }
.dialog-icon.danger { color: var(--red); background: #ffe1e1; }
.dialog-icon.success { color: var(--mint-700); background: var(--mint-100); }
.confirm-dialog h3 { margin-top: 15px; font-size: 19px; }
.confirm-dialog > p { margin-top: 7px; color: var(--muted); line-height: 1.65; font-size: 11px; }

.dialog-details {
  margin-top: 14px;
  padding: 12px;
  text-align: left;
  border-radius: 13px;
  background: var(--surface-2);
  font-size: 10px;
}

.warning-list {
  margin: 0;
  padding-left: 17px;
}

.warning-list li + li { margin-top: 4px; }

.dialog-actions {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.toast {
  width: min(430px, calc(100% - 26px));
  min-height: 52px;
  padding: 11px 14px;
  position: fixed;
  left: 50%;
  bottom: 94px;
  z-index: 160;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow-md);
  animation: toast-in 220ms ease both;
}

@keyframes toast-in {
  from { transform: translate(-50%, 12px); opacity: 0; }
}

.toast > span {
  width: 31px;
  height: 31px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 10px;
}

.toast p { font-size: 11px; font-weight: 700; }
.toast.success > span { color: var(--mint-700); background: var(--mint-100); }
.toast.warning > span { color: #9a6506; background: #fff0bd; }
.toast.danger > span { color: var(--red); background: #ffe1e1; }
.toast.info > span { color: #2867ae; background: #deedff; }

.method-tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

.method-tabs button {
  min-height: 68px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface-2);
}

.method-tabs button.active {
  color: var(--mint-700);
  background: var(--mint-100);
  border-color: var(--mint-300);
}

.method-tabs button small { font-size: 9px; font-weight: 800; }
.expense-editor > .notice-strip { margin-top: 14px; }
.expense-editor > .error-summary { margin-top: 14px; margin-bottom: 0; }
.expense-form { margin-top: 18px; }

.record-method {
  margin-top: 18px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface-2);
  font-size: 10px;
}

.record-method > span {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
}

.record-method > span svg { color: var(--mint-600); }

.review-actions {
  margin-top: 21px;
  display: flex;
  justify-content: flex-end;
  gap: 9px;
}

.expense-review > .notice-strip { margin-bottom: 18px; }

.review-amount {
  padding: 19px;
  display: flex;
  align-items: center;
  gap: 14px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface-2);
}

.review-amount > div { display: flex; flex-direction: column; }
.review-amount small { color: var(--muted); font-size: 9px; }
.review-amount strong { margin-top: 2px; font-size: 28px; letter-spacing: -1px; }

.review-list {
  margin: 17px 0 0;
  padding: 0;
  border-top: 1px solid var(--line);
}

.review-list > div {
  padding: 12px 2px;
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}

.review-list dt { color: var(--muted); font-size: 10px; }
.review-list dd { margin: 0; display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; }

/* Summary */

.summary-content {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.summary-result {
  min-height: 230px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-radius: 25px;
}

.summary-result.survived {
  color: #075747;
  background:
    radial-gradient(circle at 50% 0, rgba(255,255,255,.7), transparent 36%),
    linear-gradient(145deg, #d8f8ed, #effff9);
  border: 1px solid #b1efda;
}

.summary-result.over {
  color: #8f2525;
  background: linear-gradient(145deg, #ffe8e8, #fff6f6);
  border: 1px solid #ffcaca;
}

.summary-celebration { font-size: 42px; }
.summary-result .simulation-badge { margin-top: 8px; }
.summary-result h2 { margin-top: 8px; font-size: 28px; }
.summary-result p { margin-top: 3px; opacity: 0.7; font-size: 10px; }
.summary-result > strong { margin-top: 9px; font-size: 21px; }

.summary-stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}

.summary-stat-grid article {
  padding: 15px;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--surface);
}

.summary-stat-grid small { color: var(--muted); font-size: 8px; }
.summary-stat-grid strong { margin-top: 3px; font-size: 15px; }

.summary-highlights {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.summary-highlights > div {
  padding: 14px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 11px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--surface);
}

.summary-highlights > div > span {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: var(--surface-3);
  font-size: 20px;
}

.summary-highlights p { display: flex; flex-direction: column; }
.summary-highlights small { color: var(--muted); font-size: 8px; }
.summary-highlights strong { margin-top: 2px; font-size: 11px; }
.summary-highlights b { color: var(--mint-700); font-size: 11px; }

/* Responsive */

@media (max-width: 900px) {
  .welcome-grid { gap: 25px; }
  .welcome-visual { transform: scale(0.9); }
  .chip-budget { left: -2%; }
  .chip-alert { right: -4%; }
  .setup-layout { gap: 30px; }
  .restaurant-list { grid-template-columns: 1fr; }
  .scan-workspace { grid-template-columns: 1fr; }
  .sample-slip-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 720px) {
  body { font-size: 14px; }

  .welcome-shell { width: min(100% - 28px, 540px); padding-top: 17px; }
  .welcome-grid {
    min-height: auto;
    padding: 50px 0 23px;
    grid-template-columns: 1fr;
    gap: 28px;
  }
  .welcome-copy { text-align: center; }
  .kicker { margin: 0 auto; }
  .welcome-copy h1 { font-size: clamp(39px, 12vw, 58px); letter-spacing: -2px; }
  .welcome-copy h1 span { display: block; margin: 4px 0 0; }
  .welcome-copy > p { font-size: 14px; line-height: 1.8; }
  .trust-note { justify-content: center; text-align: left; }
  .welcome-visual { min-height: 520px; transform: scale(0.91); margin: -15px 0; }
  .phone-preview { width: 292px; min-height: 530px; }
  .chip-budget { left: -2%; top: 22%; }
  .chip-alert { right: -3%; bottom: 10%; }
  .floating-chip { min-width: 166px; padding: 10px; }
  .welcome-features { grid-template-columns: 1fr; padding: 10px 14px; }
  .welcome-features article + article { border-left: 0; border-top: 1px solid var(--line); }

  .setup-topbar { width: calc(100% - 26px); }
  .setup-topbar .brand-copy { display: none; }
  .setup-layout,
  .embedded .setup-layout {
    width: min(100% - 26px, 560px);
    padding: 18px 0 50px;
    grid-template-columns: 1fr;
    gap: 56px;
  }
  .embedded .setup-layout { width: 100%; padding: 0; }
  .setup-copy,
  .embedded .setup-copy { padding: 15px 0 0; position: static; text-align: center; }
  .setup-copy h1, .embedded .setup-copy h1 { font-size: 31px; }
  .setup-copy > p { font-size: 12px; }
  .step-pill { margin: 0 auto; }
  .logic-mini-flow { width: fit-content; margin: 27px auto 0; }
  .setup-card { padding: 21px 17px; border-radius: 23px; }
  .form-row { grid-template-columns: 1fr; gap: 15px; }
  .form-row .field + .field { margin-top: 0; }
  .plan-preview { grid-template-columns: 1fr auto 1fr; }
  .plan-preview > div:last-child { grid-column: 1 / -1; }

  function escapeHtml(value) {

      .replace(/"/g, "&quot;")

  function datePartsInBangkok(date) {
    var parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Bangkok",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(date);
    function get(type) {
      var found = parts.find(function (part) { return part.type === type; });
      return found ? found.value : "";
    }
    return get("year") + "-" + get("month") + "-" + get("day");
  }

  function todayIso() {
    return datePartsInBangkok(new Date());
  }

  function currentTime() {
    return new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Bangkok",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).format(new Date());
  }

  function parseIsoDate(value) {
    var parts = String(value).split("-").map(Number);
    return new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
  }

  function addDays(value, amount) {
    var date = parseIsoDate(value);
    date.setUTCDate(date.getUTCDate() + amount);
    return date.toISOString().slice(0, 10);
  }

  function dayDifference(from, to) {
    return Math.round((parseIsoDate(to).getTime() - parseIsoDate(from).getTime()) / DAY_MS);
  }

  function endDateOf(plan) {
    return addDays(plan.startDate, Math.max(0, plan.days - 1));
  }

  function isDateInPlan(date, plan) {
    return Boolean(date) && date >= plan.startDate && date <= endDateOf(plan);

  function formatMoney(value) {

    return new Intl.NumberFormat("th-TH", {

    }).format(safe);
  }

  function formatThaiDate(value, longFormat) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value))) return "–";
    return new Intl.DateTimeFormat("th-TH", {
      timeZone: "Asia/Bangkok",
      day: "numeric",
      month: longFormat ? "long" : "short",
      year: longFormat ? "numeric" : undefined
    }).format(parseIsoDate(value));
  }

  function formatThaiDay(value) {

  function distanceMeters(aLat, aLng, bLat, bLng) {
    var radius = 6371000;
    var rad = function (value) { return value * Math.PI / 180; };
    var dLat = rad(bLat - aLat);
    var dLng = rad(bLng - aLng);
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2)
      + Math.cos(rad(aLat)) * Math.cos(rad(bLat)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return radius * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  }

  function validatePlan(plan) {
    var errors = [];
    if (!String(plan.name || "").trim()) errors.push("กรุณาตั้งชื่อแผน");
    if (!Number.isFinite(plan.totalBudget) || plan.totalBudget <= 0) errors.push("งบประมาณต้องมากกว่า 0 บาท");
    if (!Number.isFinite(plan.days) || plan.days <= 0 || !Number.isInteger(plan.days)) errors.push("จำนวนวันต้องเป็นจำนวนเต็มมากกว่า 0");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(plan.startDate)) errors.push("กรุณาเลือกวันที่เริ่มต้น");
    if (!Number.isFinite(plan.dailyLimit) || plan.dailyLimit <= 0) errors.push("วงเงินรายวันต้องมากกว่า 0 บาท");
    else if (plan.dailyLimit > plan.totalBudget) errors.push("วงเงินรายวันต้องไม่เกินงบประมาณทั้งหมด");
    return errors;
  }

  function validateExpense(expense, plan) {
    var errors = [];
    if (!String(expense.name || "").trim()) errors.push("กรุณากรอกชื่อรายการ");
    if (!Number.isFinite(expense.amount) || expense.amount <= 0) errors.push("จำนวนเงินต้องเป็นตัวเลขมากกว่า 0");
    if (!categoryMeta(expense.categoryId)) errors.push("กรุณาเลือกหมวดหมู่");
    if (!expense.date) errors.push("กรุณาเลือกวันที่");
    else if (!isDateInPlan(expense.date, plan)) errors.push("วันที่ต้องอยู่ในช่วงแผน " + formatThaiDate(plan.startDate) + "–" + formatThaiDate(endDateOf(plan)));
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(expense.time)) errors.push("กรุณาระบุเวลาให้ถูกต้อง");
    return errors;
  }

  function dailyTotals(plan, expenses) {
    return Array.from({ length: Math.max(0, plan.days) }, function (_, index) {
      var date = addDays(plan.startDate, index);
      var amount = expenses.filter(function (expense) { return expense.date === date; })
        .reduce(function (sum, expense) { return sum + expense.amount; }, 0);
      return { date: date, amount: amount };
    });
  }

  function categoryTotals(expenses) {
    var totals = {};
    expenses.forEach(function (expense) {
      totals[expense.categoryId] = (totals[expense.categoryId] || 0) + expense.amount;
    });
    return Object.keys(totals).map(function (categoryId) {
      return { categoryId: categoryId, amount: totals[categoryId] };
    }).sort(function (a, b) { return b.amount - a.amount; });
  }

  function getBudgetMetrics(plan, expenses, now) {
    var current = now || todayIso();
    var inPlan = expenses.filter(function (expense) { return isDateInPlan(expense.date, plan); });
    var end = endDateOf(plan);
    var totalSpent = inPlan.reduce(function (sum, expense) { return sum + expense.amount; }, 0);
    var remaining = plan.totalBudget - totalSpent;
    var todaySpent = inPlan.filter(function (expense) { return expense.date === current; })
      .reduce(function (sum, expense) { return sum + expense.amount; }, 0);
    var dailyHeadroom = plan.dailyLimit - todaySpent;
    var todayRemaining = Math.max(0, Math.min(Math.max(0, remaining), dailyHeadroom));
    var todayOverAmount = Math.max(0, todaySpent - plan.dailyLimit);
    var usagePercent = plan.totalBudget > 0 ? totalSpent / plan.totalBudget * 100 : 0;
    var todayUsagePercent = plan.dailyLimit > 0 ? todaySpent / plan.dailyLimit * 100 : 0;
    var rawElapsed = dayDifference(plan.startDate, current) + 1;
    var elapsedDays = current < plan.startDate ? 0 : Math.max(0, Math.min(plan.days, rawElapsed));
    var planComplete = current > end;
    var daysRemaining = current < plan.startDate ? plan.days : planComplete ? 0 : Math.max(1, dayDifference(current, end) + 1);
    var daysAfterToday = current < plan.startDate ? plan.days : planComplete ? 0 : Math.max(0, dayDifference(current, end));
    var activeDates = new Set(inPlan.filter(function (expense) { return expense.date <= current; }).map(function (expense) { return expense.date; }));
    var pastSpend = inPlan.filter(function (expense) { return expense.date <= current; })
      .reduce(function (sum, expense) { return sum + expense.amount; }, 0);
    var averageDaily = activeDates.size > 0 ? pastSpend / activeDates.size : 0;
    var recommendedDaily = daysRemaining > 0 ? Math.max(0, Math.min(plan.dailyLimit, remaining / daysRemaining)) : Math.max(0, remaining);
    var predictionReady = elapsedDays >= 3 && inPlan.length >= 3 && activeDates.size >= 2;
    var forecastEnd = predictionReady ? remaining - averageDaily * daysAfterToday : remaining;
    var status = "ปลอดภัย";
    if (remaining < 0) status = "งบประมาณหมด";
    else if (todayUsagePercent > 100) status = "เกินงบรายวัน";
    else if (todayUsagePercent > 90) status = "ใกล้ถึงขีดจำกัด";
    else if (todayUsagePercent > 70) status = "ควรระวัง";
    var daily = dailyTotals(plan, inPlan);
    var overDays = daily.filter(function (day) { return day.date <= current && day.amount > plan.dailyLimit; }).length;
    var categories = categoryTotals(inPlan);
    var highest = daily.filter(function (day) { return day.date <= current; })
      .reduce(function (best, day) { return day.amount > best.amount ? { date: day.date, amount: day.amount } : best; }, { date: null, amount: 0 });
    var stores = {};
    inPlan.forEach(function (expense) {
      var store = expense.store.trim();
      if (store) stores[store] = (stores[store] || 0) + 1;
    });
    var favoriteStore = Object.keys(stores).sort(function (a, b) { return stores[b] - stores[a]; })[0] || "ยังไม่มีข้อมูล";
    var periods = { "เช้า": 0, "กลางวัน": 0, "เย็น": 0 };
    inPlan.forEach(function (expense) {
      var hour = Number(expense.time.split(":")[0]);
      if (hour < 11) periods["เช้า"] += expense.amount;
      else if (hour < 16) periods["กลางวัน"] += expense.amount;
      else periods["เย็น"] += expense.amount;
    });
    var peakPeriod = Object.keys(periods).sort(function (a, b) { return periods[b] - periods[a]; })[0] || "ยังไม่มีข้อมูล";
    return {
      totalSpent: totalSpent,
      remaining: remaining,
      todaySpent: todaySpent,
      todayRemaining: todayRemaining,
      todayOverAmount: todayOverAmount,
      usagePercent: usagePercent,
      todayUsagePercent: todayUsagePercent,
      elapsedDays: elapsedDays,
      daysRemaining: daysRemaining,
      daysAfterToday: daysAfterToday,
      recommendedDaily: recommendedDaily,
      averageDaily: averageDaily,
      forecastEnd: forecastEnd,
      predictionReady: predictionReady,
      transactionCount: inPlan.length,
      activeExpenseDays: activeDates.size,
      status: status,
      planComplete: planComplete,
      overDays: overDays,
      highestCategory: categories.length ? categories[0].categoryId : null,
      highestCategoryAmount: categories.length ? categories[0].amount : 0,
      highestDay: highest.date,
      highestDayAmount: highest.amount,
      favoriteStore: favoriteStore,
      peakPeriod: peakPeriod
    };
  }

  function statusTone(status) {
    if (status === "ปลอดภัย") return "safe";
    if (status === "ควรระวัง") return "caution";
    if (status === "ใกล้ถึงขีดจำกัด") return "near";
    return "danger";
  }

  function statusBadge(status) {
    return '<span class="status-badge ' + statusTone(status) + '"><span class="status-dot"></span>' + escapeHtml(status) + "</span>";
  }

  function notice(tone, iconName, content) {
    return '<div class="notice-strip ' + tone + '"><span>' + icon(iconName, 18) + "</span><div>" + content + "</div></div>";
  }

  function showToast(message, tone) {
    var id = Date.now();
    ui.toast = { id: id, message: message, tone: tone || "success" };
    render();
    window.setTimeout(function () {
      if (ui.toast && ui.toast.id === id) {
        ui.toast = null;
        render();
      }
    }, 3400);
  }

  function toastHtml() {
    if (!ui.toast) return "";
    var iconName = ui.toast.tone === "success" ? "check" : ui.toast.tone === "info" ? "sparkles" : "warning";
    return '<div class="toast ' + ui.toast.tone + '" role="status" aria-live="polite"><span>'
      + icon(iconName, 18) + "</span><p>" + escapeHtml(ui.toast.message) + "</p></div>";
  }

  function navigate(tab) {
    if (TABS.indexOf(tab) < 0) tab = "home";
    ui.activeTab = tab;
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, "", window.location.pathname + window.location.search + "#" + tab);
    } else {
      window.location.hash = tab;
    }
    window.scrollTo(0, 0);
    render();
  }

  function stopCamera() {
    if (cameraLoop) cancelAnimationFrame(cameraLoop);
    cameraLoop = 0;
    if (cameraStream) {
      cameraStream.getTracks().forEach(function (track) { track.stop(); });
      cameraStream = null;
    }
    ui.cameraStatus = "idle";
  }

  function closeOverlay() {
    if (ui.editor) ui.editor = null;
    else if (ui.modal) ui.modal = null;
    stopCamera();
    render();
  }

  window.addEventListener("hashchange", function () {
    var next = window.location.hash.replace("#", "");
    if (TABS.indexOf(next) >= 0 && next !== ui.activeTab) {
      ui.activeTab = next;
      render();
    }
  });

  document.addEventListener("visibilitychange", function () {

  function miniChart(plan, expenses, compact) {
    var series = dailyTotals(plan, expenses).slice(-7);
    var max = Math.max.apply(Math, [plan.dailyLimit, 1].concat(series.map(function (item) { return item.amount; })));
    var lineBottom = Math.min(96, plan.dailyLimit / max * 100);
    return '<div class="mini-chart ' + (compact ? "compact" : "") + '"><div class="chart-plot">'
      + '<div class="limit-line" style="bottom:' + lineBottom + '%">' + (compact ? "" : '<span>วงเงิน ' + formatMoney(plan.dailyLimit) + '</span>') + '</div>'
      + series.map(function (item, index) {
        var height = Math.max(4, item.amount / max * 100);
        var over = item.amount > plan.dailyLimit;
        return '<div class="bar-column">' + (compact ? "" : '<span class="bar-value">' + (item.amount ? formatMoney(item.amount) : "–") + '</span>')
          + '<div class="bar-track"><div class="bar-fill ' + (over ? "over" : "") + '" style="height:' + height + '%"></div></div>'
          + '<span class="bar-label">' + formatThaiDay(item.date) + '<small>' + (index + 1) + '</small></span></div>';
      }).join("") + '</div></div>';
  }

  function renderBudget() {

      + (filtered.length ? '<div class="expense-list">' + filtered.map(function (expense) { return expenseRow(expense, true); }).join("") + '</div>' : emptyState("search", "ไม่พบรายการที่ค้นหา", "ลองเปลี่ยนคำค้น วันที่ หรือหมวดหมู่"))
      + '</section>';
    var topCategoryShare = metrics.totalSpent > 0 ? metrics.highestCategoryAmount / metrics.totalSpent * 100 : 0;
    var analysis = '<section class="analysis-stack"><div class="analysis-grid">'
      + metricCard("chart", "mint", "เฉลี่ยต่อวัน", "฿" + formatMoney(metrics.averageDaily), "จาก " + Math.max(1, metrics.elapsedDays) + " วันที่ผ่านมา")
      + metricCard("receipt", "amber", "หมวดที่ใช้มากที่สุด", metrics.highestCategory ? categoryMeta(metrics.highestCategory).label : "ยังไม่มีข้อมูล", "฿" + formatMoney(metrics.highestCategoryAmount))
      + metricCard("calendar", "violet", "วันที่ใช้มากที่สุด", metrics.highestDay ? formatThaiDate(metrics.highestDay) : "–", "฿" + formatMoney(metrics.highestDayAmount))
      + metricCard("clock", "blue", "ช่วงเวลาที่ใช้มาก", metrics.peakPeriod, "วิเคราะห์จากเวลาบันทึก")
      + metricCard("store", "rose", "ร้านที่ใช้บ่อย", metrics.favoriteStore, "นับจากจำนวนรายการ")
      + metricCard("warning", "red", "วันที่เกินวงเงิน", metrics.overDays + " วัน", "จากแผน " + plan.days + " วัน")
      + '</div><article class="card chart-card full-chart"><div class="card-heading"><div><span class="section-kicker">พฤติกรรมตลอดแผน</span><h2>รายจ่ายเทียบวงเงิน</h2></div>' + statusBadge(metrics.status) + '</div>' + miniChart(plan, state.expenses, false) + '</article>'
      + '<div class="insight-list">'
      + notice(metrics.todayOverAmount > 0 ? "red" : "mint", "target", '<strong>' + (metrics.todayOverAmount > 0 ? "วันนี้ใช้เกินวงเงิน " + formatMoney(metrics.todayOverAmount) + " บาท" : "วันนี้คุณเหลืองบอีก " + formatMoney(metrics.todayRemaining) + " บาท") + '</strong><p>' + (metrics.todayOverAmount > 0 ? "รายการยังถูกเก็บไว้เพื่อให้คุณปรับแผนได้" : "เลือกรายการที่ไม่เกินวงเงินส่วนนี้ได้") + '</p>')
      + notice("blue", "chart", '<strong>' + (!metrics.highestCategory ? "ยังไม่มีหมวดรายจ่ายหลัก" : categoryMeta(metrics.highestCategory).label + " คิดเป็น " + Math.round(topCategoryShare) + "% ของรายจ่าย") + '</strong><p>ยอดรวมหมวดนี้ ' + formatMoney(metrics.highestCategoryAmount) + ' บาท</p>')
      + notice(metrics.overDays ? "amber" : "mint", "calendar", '<strong>ใช้เกินวงเงิน ' + metrics.overDays + ' วัน จาก ' + Math.max(1, metrics.elapsedDays) + ' วันที่ผ่านไป</strong><p>' + (metrics.overDays ? "ลองลดค่าใช้จ่ายที่ไม่จำเป็นในวันที่เหลือ" : "รักษาจังหวะแบบนี้ต่อไป") + '</p>')
      + notice(!metrics.predictionReady || metrics.forecastEnd >= 0 ? "mint" : "red", "sparkles", '<strong>' + (!metrics.predictionReady ? "รอข้อมูลเพิ่มก่อนคาดการณ์" : metrics.forecastEnd >= 0 ? "มีแนวโน้มรอดตามงบ" : "มีแนวโน้มเงินไม่พอ") + '</strong><p>' + (metrics.predictionReady ? "คาดการณ์วันสุดท้าย " + (metrics.forecastEnd >= 0 ? "เหลือ " : "ขาด ") + formatMoney(Math.abs(metrics.forecastEnd)) + " บาท" : "ต้องมีอย่างน้อย 3 รายการใน 2 วันที่ใช้จริง") + '</p>')

    return '<div class="budget-page page-stack"><section class="page-intro"><div><p>จัดการแผนและประวัติ</p><h1>งบประมาณ</h1><span>ทุกการแก้ไขจะคำนวณ Dashboard ใหม่ทันที</span></div><button class="button primary" data-action="add-expense">' + icon("plus") + ' เพิ่มรายจ่าย</button></section>'

      + '<div class="plan-overview-stats"><span><small>งบเริ่มต้น</small><strong>฿' + formatMoney(plan.totalBudget) + '</strong></span><span><small>วงเงิน/วัน</small><strong>฿' + formatMoney(plan.dailyLimit) + '</strong></span><span><small>ใช้ไปแล้ว</small><strong>฿' + formatMoney(metrics.totalSpent) + '</strong></span><span><small>คงเหลือ</small><strong class="' + (metrics.remaining < 0 ? "negative" : "") + '">฿' + formatMoney(metrics.remaining) + '</strong></span></div>'

      + (ui.budgetSection === "history" ? history : analysis) + '</div>';
  }

  function metricCard(iconName, tone, label, value, noteText) {
    return '<article class="metric-card"><span class="metric-icon ' + tone + '">' + icon(iconName) + '</span><small>' + escapeHtml(label) + '</small><strong>' + escapeHtml(value) + '</strong><p>' + escapeHtml(noteText) + '</p></article>';
  }

  function mapEmbedUrl(latitude, longitude, radius) {
    var latitudeSpan = Math.max(0.009, radius / 111320);
    var longitudeSpan = latitudeSpan / Math.max(0.25, Math.cos(latitude * Math.PI / 180));
    var bbox = [
      longitude - longitudeSpan,
      latitude - latitudeSpan,
      longitude + longitudeSpan,
      latitude + latitudeSpan
    ].map(function (value) { return value.toFixed(6); }).join(",");
    return "https://www.openstreetmap.org/export/embed.html?bbox=" + encodeURIComponent(bbox) + "&layer=mapnik&marker=" + encodeURIComponent(latitude + "," + longitude);
  }

  function nearbyGoogleMapsUrl(latitude, longitude) {
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent("ร้านอาหารใกล้ " + latitude + "," + longitude);
  }

  function storeMapUrl(place) {
    var origin = ui.location.lat + "," + ui.location.lng;
    var destination = place.latitude + "," + place.longitude;
    return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(destination) + "&travelmode=walking&origin=" + encodeURIComponent(origin);
  }

  function renderStores() {
    var metrics = getBudgetMetrics(state.plan, state.expenses);
    var places = restaurantRecords(ui.location).filter(function (place) {
      var normalized = ui.storeSearch.toLocaleLowerCase("th").replace("coffee", "กาแฟ").replace("cafe", "คาเฟ่");
      var haystack = (place.name + " " + place.kind).toLocaleLowerCase("th");
      var coffeeMatch = /กาแฟ|คาเฟ่/.test(normalized) && /coffee|cafe|กาแฟ|คาเฟ่/i.test(place.name + " " + place.kind);
      var id = place.provider + ":" + place.placeId;
      return place.distanceMeters <= ui.storeRadius
        && (!normalized || haystack.indexOf(normalized) >= 0 || coffeeMatch)
        && (ui.storeKind === "ทั้งหมด" || place.kind === ui.storeKind)
        && (!ui.favoritesOnly || state.favorites.indexOf(id) >= 0);
    }).sort(function (a, b) { return a.distanceMeters - b.distanceMeters; });
    var kinds = ["ทั้งหมด"].concat(Array.from(new Set(restaurantRecords(ui.location).map(function (item) { return item.kind; }))));
    var locationHeading = ui.locationStatus === "active" ? "กำลังใช้ตำแหน่งจริง" : ui.locationStatus === "requesting" ? "กำลังขอสิทธิ์จากเบราว์เซอร์" : ui.locationStatus === "error" || ui.locationStatus === "unsupported" ? "ยังใช้ตำแหน่งจริงไม่ได้" : "ยังไม่ได้ใช้ตำแหน่งจริง";
    var locationText = ui.locationStatus === "idle" ? "กด “อนุญาตตำแหน่ง” แล้วเบราว์เซอร์จะถามสิทธิ์ทันที จากนั้นร้านจะเรียงจากใกล้ไปไกล" : ui.locationMessage;
    var cards = places.map(function (restaurant) {
      var favoriteId = restaurant.provider + ":" + restaurant.placeId;
      var favorite = state.favorites.indexOf(favoriteId) >= 0;
      return '<article class="restaurant-card"><button class="restaurant-thumb real-place-thumb" data-action="select-store" data-id="' + restaurant.placeId + '"><span>' + (restaurant.kind.indexOf("คาเฟ่") >= 0 ? "☕" : "🍽️") + '</span></button>'
        + '<div class="restaurant-info" data-action="select-store" data-id="' + restaurant.placeId + '"><div><h3>' + escapeHtml(restaurant.name) + '</h3><button class="heart ' + (favorite ? "active" : "") + '" data-action="favorite-store" data-id="' + escapeAttr(favoriteId) + '" aria-label="ร้านโปรด">' + icon("heart", 19, favorite) + '</button></div>'
        + '<p>' + escapeHtml(restaurant.kind) + '</p><small class="place-provider">แหล่งข้อมูล: OpenStreetMap fallback</small>'
        + '<div class="restaurant-meta"><span>📍 ' + restaurant.distanceMeters.toLocaleString("th-TH") + ' ม. ' + (ui.location.fromGps ? "จากคุณ" : "จากจุดอ้างอิง") + '</span><span>🚶 ประมาณ ' + restaurant.walkMinutes + ' นาที</span></div>'
        + '<div class="restaurant-foot"><span class="price-unknown">ราคา: ยังไม่มีระดับราคาจากแหล่งข้อมูล</span><span class="unknown">ไม่ทราบเวลาเปิด</span></div></div>'
        + '<button class="card-chevron" data-action="select-store" data-id="' + restaurant.placeId + '">' + icon("chevron") + '</button></article>';
    }).join("");
    return '<div class="stores-page page-stack"><section class="store-location"><div><span>' + icon("pin", 17) + ' จุดวัดระยะ</span><strong>' + escapeHtml(ui.location.label) + '</strong><small>พิกัดใช้ค้นหาร้านและแสดงแผนที่ชั่วคราวเท่านั้น ไม่บันทึกในประวัติของเป๋าตุง</small></div><button class="button primary small" data-action="request-location"' + (ui.locationStatus === "requesting" ? " disabled" : "") + '>' + icon("pin", 15) + " " + (ui.locationStatus === "requesting" ? "กำลังขอสิทธิ์…" : ui.location.fromGps ? "อัปเดตตำแหน่ง" : "อนุญาตตำแหน่ง") + '</button></section>'
      + '<div class="location-feedback ' + ui.locationStatus + '" role="status" aria-live="polite"><span>' + icon(ui.locationStatus === "active" ? "check" : ui.locationStatus === "error" || ui.locationStatus === "unsupported" ? "warning" : "target", 18) + '</span><div><strong>' + locationHeading + '</strong><p>' + escapeHtml(locationText) + '</p></div>' + (ui.locationStatus === "error" || ui.locationStatus === "unsupported" ? '<button class="button secondary small" data-action="request-location">ลองขอสิทธิ์อีกครั้ง</button>' : "") + '</div>'
      + '<section class="store-search-panel"><label class="store-search">' + icon("search") + '<input id="store-search" value="' + escapeAttr(ui.storeSearch) + '" placeholder="ค้นหาร้านหรือประเภทอาหาร"></label><button class="favorite-filter ' + (ui.favoritesOnly ? "active" : "") + '" data-action="favorites-only">' + icon("heart", 21, ui.favoritesOnly) + ' ร้านโปรด</button></section>'
      + '<div class="filter-scroll"><label>' + icon("filter", 16) + '<select id="store-radius"><option value="3000"' + (ui.storeRadius === 3000 ? " selected" : "") + '>รัศมี 3 กม.</option><option value="5000"' + (ui.storeRadius === 5000 ? " selected" : "") + '>รัศมี 5 กม.</option></select></label><label><select id="store-kind">' + kinds.map(function (kind) { return '<option' + (kind === ui.storeKind ? " selected" : "") + '>' + escapeHtml(kind) + '</option>'; }).join("") + '</select></label></div>'
