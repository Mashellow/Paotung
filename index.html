  <title>เป๋าตุง — Canva Port</title>
  <style>
:root {
  --bg: #f4f8f7;
  --surface: #ffffff;
  --surface-2: #f7faf9;
  --surface-3: #eef5f3;
  --ink: #14231f;
  --muted: #687a74;
  --subtle: #90a09b;
  --line: #dfe9e6;
  --mint-50: #edfff9;
  --mint-100: #d8f8ed;
  --mint-200: #b1efda;
  --mint-300: #7adfc1;
  --mint-400: #3fc7a1;
  --mint-500: #19a982;
  --mint-600: #0b8a69;
  --mint-700: #087057;
  --mint-800: #075747;
  --mint-900: #073f35;
  --amber: #f59e0b;
  --orange: #f97316;
  --red: #ef4444;
  --blue: #3b82f6;
  --violet: #8b5cf6;
  --shadow-sm: 0 4px 18px rgba(18, 62, 50, 0.07);
  --shadow-md: 0 18px 50px rgba(18, 62, 50, 0.12);
  --shadow-lg: 0 30px 80px rgba(8, 57, 45, 0.2);
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 26px;
  --radius-xl: 34px;
}

:root[data-theme="dark"] {
  --bg: #07110f;
  --surface: #0d1b18;
  --surface-2: #11221e;
  --surface-3: #172b26;
  --ink: #edf9f5;
  --muted: #9cb3ab;
  --subtle: #6f8880;
  --line: #213a34;
  --mint-50: #102a24;
  --mint-100: #15372e;
  --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.24);
  --shadow-md: 0 18px 50px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 30px 80px rgba(0, 0, 0, 0.5);
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-geist-sans), "Noto Sans Thai", "Tahoma", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}

button,
input,
select,
textarea {
  color: inherit;
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

input,
select,
textarea {
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--mint-500) !important;
  box-shadow: 0 0 0 3px rgba(25, 169, 130, 0.13);
}

img {
  max-width: 100%;
}

h1,
h2,
h3,
h4,
p {
  margin: 0;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.button {
  min-height: 46px;
  border-radius: 14px;
  padding: 0 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  font-weight: 700;
  transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
}

.button:hover {
  transform: translateY(-1px);
}

.button.primary {
  color: white;
  background: var(--mint-600);
  box-shadow: 0 9px 25px rgba(11, 138, 105, 0.23);
}

.button.primary:hover {
  background: var(--mint-700);
}

.button.secondary {
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
}

.button.ghost {
  min-height: 40px;
  background: transparent;
  color: var(--muted);
}

.button.glass {
  min-height: 42px;
  color: white;
  background: rgba(255, 255, 255, 0.13);
  border: 1px solid rgba(255, 255, 255, 0.24);
  backdrop-filter: blur(10px);
}

.button.small {
  min-height: 38px;
  border-radius: 11px;
  padding: 0 13px;
  font-size: 13px;
}

.button.danger-button {
  color: white;
  background: var(--red);
}

.full-button {
  width: 100%;
}

.text-danger,
.negative {
  color: var(--red) !important;
}

.text-button {
  padding: 7px 0;
  background: transparent;
  color: var(--mint-600);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 700;
  font-size: 13px;
}

.icon-button {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  transition: background 180ms ease, transform 180ms ease;
}

.icon-button:hover {
  background: var(--mint-50);
  transform: translateY(-1px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 15px 15px 15px 6px;
  display: grid;
  place-items: center;
  color: white;
  background: linear-gradient(145deg, var(--mint-400), var(--mint-700));
  box-shadow: 0 9px 22px rgba(11, 138, 105, 0.24);
  transform: rotate(-3deg);
}

.brand-mark span {
  font-size: 21px;
  font-weight: 900;
  transform: rotate(3deg);
}

.brand-copy {
  display: flex;
  flex-direction: column;
}

.brand-copy strong {
  font-size: 20px;
  line-height: 1.05;
  letter-spacing: -0.5px;
}

.brand-copy small {
  margin-top: 3px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
}

.simulation-badge {
  width: fit-content;
  padding: 5px 9px;
  color: var(--mint-700);
  background: var(--mint-100);
  border: 1px solid var(--mint-200);
  border-radius: 999px;
  font-size: 10px;
  line-height: 1;
  font-weight: 800;
  white-space: nowrap;
}

.simulation-badge.subtle {
  padding: 4px 7px;
  color: var(--muted);
  background: var(--surface-3);
  border-color: var(--line);
  font-size: 9px;
}

.status-badge {
  width: fit-content;
  min-height: 30px;
  padding: 0 10px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 800;
  color: white;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #8fffd6;
  box-shadow: 0 0 0 4px rgba(143, 255, 214, 0.12);
}

.status-badge.caution .status-dot {
  background: #fde68a;
}

.status-badge.near .status-dot {
  background: #fdba74;
}

.status-badge.danger .status-dot {
  background: #fecaca;
}

.loading-screen {
  min-height: 100dvh;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 16px;
  background: radial-gradient(circle at 50% 40%, var(--mint-100), var(--bg) 45%);
}

.loader-logo {
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  color: white;
  background: linear-gradient(145deg, var(--mint-400), var(--mint-700));
  border-radius: 24px 24px 24px 8px;
  box-shadow: var(--shadow-md);
  font-size: 31px;
  font-weight: 900;
  animation: loader-breathe 1.6s ease-in-out infinite;
}

.loading-dots {
  display: flex;
  gap: 6px;
}

.loading-dots span {
  width: 7px;
  height: 7px;
  background: var(--mint-500);
  border-radius: 50%;
  animation: dot-hop 1s ease-in-out infinite;
}

.loading-dots span:nth-child(2) { animation-delay: 0.15s; }
.loading-dots span:nth-child(3) { animation-delay: 0.3s; }
.loading-screen p { color: var(--muted); font-size: 13px; }

@keyframes loader-breathe {
  50% { transform: translateY(-5px) rotate(-2deg); }
}

@keyframes dot-hop {
  50% { transform: translateY(-5px); opacity: 0.5; }
}

/* Welcome */

.welcome-page {
  min-height: 100dvh;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 10% 10%, rgba(122, 223, 193, 0.24), transparent 32%),
    radial-gradient(circle at 90% 25%, rgba(25, 169, 130, 0.14), transparent 30%),
    linear-gradient(180deg, #f9fffd 0%, var(--bg) 100%);
}

:root[data-theme="dark"] .welcome-page {
  background:
    radial-gradient(circle at 10% 10%, rgba(25, 169, 130, 0.16), transparent 32%),
    radial-gradient(circle at 90% 25%, rgba(25, 169, 130, 0.11), transparent 30%),
    var(--bg);
}

.welcome-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(2px);
  pointer-events: none;
}

.orb-one {
  width: 360px;
  height: 360px;
  left: -230px;
  top: 36%;
  background: rgba(63, 199, 161, 0.11);
}

.orb-two {
  width: 260px;
  height: 260px;
  right: -170px;
  bottom: 5%;
  background: rgba(59, 130, 246, 0.08);
}

.welcome-shell {
  width: min(1120px, calc(100% - 36px));
  margin: 0 auto;
  padding: 24px 0 34px;
  position: relative;
  z-index: 1;
}

.welcome-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.welcome-grid {
  min-height: calc(100dvh - 220px);
  padding: 46px 0 36px;
  display: grid;
  grid-template-columns: 1.02fr 0.98fr;
  align-items: center;
  gap: 72px;
}

.welcome-copy {
  max-width: 570px;
}

.kicker {
  width: fit-content;
  padding: 7px 11px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--mint-700);
  background: var(--mint-100);
  border: 1px solid var(--mint-200);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
}

.welcome-copy h1 {
  margin-top: 19px;
  font-size: clamp(42px, 5vw, 72px);
  line-height: 1.1;
  letter-spacing: -2.7px;
}

.welcome-copy h1 span {
  display: inline-block;
  margin-left: 10px;
  color: var(--mint-600);
}

.welcome-copy > p {
  max-width: 530px;
  margin-top: 22px;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.85;
}

.welcome-cta {
  min-height: 56px;
  margin-top: 28px;
  padding: 0 24px;
  border-radius: 17px;
  font-size: 16px;
}

.trust-note {
  margin-top: 18px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
}

.trust-note svg {
  flex: 0 0 auto;
  margin-top: 1px;
  color: var(--mint-600);
}

.welcome-visual {
  min-height: 560px;
  position: relative;
  display: grid;
  place-items: center;
}

.phone-preview {
  width: 305px;
  min-height: 548px;
  padding: 17px;
  position: relative;
  overflow: hidden;
  border: 8px solid #17362e;
  border-radius: 42px;
  background: #f6faf8;
  box-shadow: 0 42px 85px rgba(10, 66, 52, 0.25);
  transform: rotate(2deg);
}

:root[data-theme="dark"] .phone-preview {
  background: #0d1b18;
}

.phone-top {
  height: 18px;
  display: flex;
  justify-content: space-between;
}

.phone-top span:first-child {
  width: 62px;
  height: 12px;
  margin: -5px auto 0;
  border-radius: 20px;
  background: #17362e;
}

.preview-greeting {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
}

.preview-greeting div {
  display: flex;
  flex-direction: column;
}

.preview-greeting small { color: var(--muted); font-size: 9px; }
.preview-greeting strong { font-size: 15px; }

.preview-avatar {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: white;
  background: var(--mint-600);
  font-size: 12px;
  font-weight: 800;
}

.preview-wallet {
  margin-top: 15px;
  padding: 19px;
  border-radius: 23px;
  color: white;
  background: linear-gradient(145deg, #0ea47c, #075747);
  box-shadow: 0 14px 30px rgba(8, 112, 87, 0.25);
}

.preview-wallet > span { font-size: 10px; opacity: 0.78; }
.preview-wallet > strong { display: block; margin-top: 4px; font-size: 27px; letter-spacing: -1px; }
.preview-wallet > small { display: block; margin-top: 7px; opacity: 0.72; font-size: 8px; }

.preview-progress {
  height: 5px;
  margin-top: 14px;
  overflow: hidden;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.15);
}

.preview-progress i {
  width: 55%;
  height: 100%;
  display: block;
  border-radius: 10px;
  background: #94ffdc;
}

.preview-stats {
  margin-top: 13px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.preview-stats span {
  padding: 13px;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
}

.preview-stats small { color: var(--muted); font-size: 8px; }
.preview-stats strong { margin-top: 4px; color: var(--ink); font-size: 15px; }

.preview-insight {
  margin-top: 10px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: 15px;
  background: #fff8df;
}

:root[data-theme="dark"] .preview-insight { background: #332b13; }

.preview-insight > span {
  width: 33px;
  height: 33px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: white;
}

.preview-insight p { display: flex; flex-direction: column; }
.preview-insight strong { font-size: 10px; }
.preview-insight small { color: #8b733d; font-size: 8px; }

.preview-bars {
  height: 122px;
  margin-top: 19px;
  padding: 10px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--surface);
}

.preview-bars i {
  flex: 1;
  min-height: 7px;
  border-radius: 7px 7px 3px 3px;
  background: linear-gradient(180deg, var(--mint-300), var(--mint-600));
}

.floating-chip {
  min-width: 185px;
  padding: 12px 14px;
  position: absolute;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 17px;
  background: rgba(255, 255, 255, 0.88);
  box-shadow: var(--shadow-md);
  backdrop-filter: blur(14px);
  animation: chip-float 4s ease-in-out infinite;
}

:root[data-theme="dark"] .floating-chip {
  background: rgba(17, 34, 30, 0.9);
  border-color: var(--line);
}

.floating-chip > span {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: white;
  background: var(--mint-500);
  border-radius: 11px;
  font-weight: 900;
}

.floating-chip p { display: flex; flex-direction: column; }
.floating-chip strong { font-size: 11px; }
.floating-chip small { color: var(--muted); font-size: 9px; }
.chip-budget { left: 4%; top: 24%; }
.chip-alert { right: -1%; bottom: 16%; animation-delay: 1.3s; }
.chip-alert > span { background: var(--amber); }

@keyframes chip-float {
  50% { transform: translateY(-7px); }
}

.welcome-features {
  padding: 18px 22px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.7);
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(12px);
}

:root[data-theme="dark"] .welcome-features { background: rgba(13, 27, 24, 0.75); }

.welcome-features article {
  padding: 9px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.welcome-features article + article { border-left: 1px solid var(--line); }

.welcome-features article > span {
  width: 39px;
  height: 39px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  color: var(--mint-700);
  background: var(--mint-100);
  border-radius: 13px;
}

.welcome-features p { display: flex; flex-direction: column; }
.welcome-features strong { font-size: 12px; }
.welcome-features small { color: var(--muted); font-size: 10px; }

/* Setup */

.setup-page {
  min-height: 100dvh;
  background:
    radial-gradient(circle at 0 0, rgba(122, 223, 193, 0.17), transparent 30%),
    var(--bg);
}

.setup-page.embedded {
  min-height: auto;
  background: transparent;
}

.setup-topbar {
  width: min(1040px, calc(100% - 32px));
  margin: 0 auto;
  padding: 21px 0;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
}

.setup-topbar .icon-button svg { transform: rotate(180deg); }
.setup-topbar .simulation-badge { justify-self: end; }

.setup-layout {
  width: min(1040px, calc(100% - 32px));
  margin: 0 auto;
  padding: 38px 0 70px;
  display: grid;
  grid-template-columns: 0.85fr 1.15fr;
  align-items: start;
  gap: 62px;
}

.embedded .setup-layout {
  width: 100%;
  padding: 0;
  grid-template-columns: 0.76fr 1.24fr;
  gap: 34px;
}

.setup-copy {
  padding-top: 48px;
  position: sticky;
  top: 20px;
}

.embedded .setup-copy { padding: 28px 0; }

.step-pill {
  width: fit-content;
  padding: 6px 10px;
  color: var(--mint-700);
  background: var(--mint-100);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
}

.setup-copy h1 {
  margin-top: 17px;
  font-size: clamp(31px, 4vw, 48px);
  line-height: 1.2;
  letter-spacing: -1.4px;
}

.embedded .setup-copy h1 { font-size: 32px; }

.setup-copy > p {
  margin-top: 16px;
  color: var(--muted);
  line-height: 1.8;
}

.logic-mini-flow {
  margin-top: 32px;
  display: flex;
  align-items: flex-start;
}

.logic-mini-flow > span {
  width: 38px;
  height: 38px;
  position: relative;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 50%;
  font-size: 12px;
  font-weight: 900;
}

.logic-mini-flow > span.active {
  color: white;
  background: var(--mint-600);
  border-color: var(--mint-600);
}

.logic-mini-flow > span small {
  width: 88px;
  position: absolute;
  top: 45px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--muted);
  text-align: center;
  font-size: 10px;
  font-weight: 600;
}

.logic-mini-flow i {
  width: 58px;
  height: 2px;
  margin-top: 18px;
  background: var(--line);
}

.setup-card {
  padding: 30px;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: var(--surface);
  box-shadow: var(--shadow-md);
}

.form-heading {
  margin-bottom: 25px;
  display: flex;
  align-items: center;
  gap: 13px;
}

.form-icon {
  width: 45px;
  height: 45px;
  display: grid;
  place-items: center;
  color: var(--mint-700);
  background: var(--mint-100);
  border-radius: 15px;
}

.form-heading h2 { font-size: 20px; }
.form-heading p { margin-top: 2px; color: var(--muted); font-size: 12px; }

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.field + .field,
.form-row + .field,
.field + .form-row {
  margin-top: 17px;
}

.field > span {
  font-size: 12px;
  font-weight: 800;
}

.field > input,
.field > select,
.field > textarea,
.input-with-icon,
.money-input,
.suffix-input,
.history-filters input,
.history-filters select,
.scan-result-form input,
.scan-result-form select {
  width: 100%;
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface-2);
}

.field > input,
.field > select,
.field > textarea,
.scan-result-form input,
.scan-result-form select {
  padding: 0 13px;
}

.field > textarea {
  min-height: 82px;
  padding-top: 12px;
  resize: vertical;
}

.input-with-icon,
.money-input,
.suffix-input {
  display: flex;
  align-items: center;
  overflow: hidden;
}

.input-with-icon > svg {
  margin-left: 13px;
  flex: 0 0 auto;
  color: var(--muted);
}

.input-with-icon input,
.money-input input,
.suffix-input input {
  width: 100%;
  min-width: 0;
  height: 46px;
  padding: 0 12px;
  border: 0;
  background: transparent;
  box-shadow: none !important;
}

.input-with-icon:focus-within,
.money-input:focus-within,
.suffix-input:focus-within {
  border-color: var(--mint-500);
  box-shadow: 0 0 0 3px rgba(25, 169, 130, 0.13);
}

.input-with-icon input:focus,
.input-with-icon input:focus-visible,
.money-input input:focus,
.money-input input:focus-visible,
.suffix-input input:focus,
.suffix-input input:focus-visible {
  outline: 0 !important;
  border: 0 !important;
  box-shadow: none !important;
}

.money-input b {
  height: 32px;
  padding: 0 12px;
  display: grid;
  place-items: center;
  color: var(--mint-700);
  border-right: 1px solid var(--line);
  font-size: 17px;
}

.suffix-input b {
  padding-right: 13px;
  color: var(--muted);
  font-size: 12px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
}

.field-hint {
  color: var(--mint-600);
  font-size: 10px;
}

.plan-preview {
  margin-top: 22px;
  padding: 15px;
  display: grid;
  grid-template-columns: 1fr auto 1fr auto 1.25fr;
  align-items: center;
  gap: 9px;
  border-radius: 17px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}

.plan-preview div {
  display: flex;
  flex-direction: column;
}

.plan-preview span { color: var(--muted); font-size: 9px; }
.plan-preview strong { margin-top: 3px; font-size: 13px; }
.plan-preview > i { color: var(--subtle); font-style: normal; }
.plan-preview .highlight {
  padding: 10px;
  border-radius: 12px;
  background: var(--mint-100);
}

.plan-preview .highlight strong { color: var(--mint-700); }

.demo-toggle {
  margin-top: 18px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 11px;
  border: 1px solid var(--line);
  border-radius: 16px;
  cursor: pointer;
}

.demo-toggle > input {
  position: absolute;
  opacity: 0;
}

.toggle-ui,
.switch {
  width: 42px;
  height: 24px;
  flex: 0 0 auto;
  padding: 3px;
  border-radius: 999px;
  background: var(--line);
  transition: background 180ms ease;
}

.toggle-ui::after,
.switch i {
  content: "";
  width: 18px;
  height: 18px;
  display: block;
  border-radius: 50%;
  background: white;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.16);
  transition: transform 180ms ease;
}

.demo-toggle > input:checked + .toggle-ui,
.switch.on {
  background: var(--mint-500);
}

.demo-toggle > input:checked + .toggle-ui::after,
.switch.on i {
  transform: translateX(18px);
}

.demo-toggle p {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.demo-toggle strong { font-size: 12px; }
.demo-toggle small { margin-top: 2px; color: var(--muted); font-size: 9px; }

.notice-strip {
  padding: 12px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border-radius: 14px;
  font-size: 11px;
  line-height: 1.65;
}

.notice-strip > span {
  margin-top: 1px;
  flex: 0 0 auto;
}

.notice-strip strong { display: block; font-size: 12px; }
.notice-strip p { margin-top: 2px; }
.notice-strip.mint { color: #087057; background: #e6fbf4; border: 1px solid #bfefdf; }
.notice-strip.amber { color: #8a5a05; background: #fff8e3; border: 1px solid #f8e3a5; }
.notice-strip.red { color: #a52727; background: #fff0f0; border: 1px solid #ffd0d0; }
.notice-strip.blue { color: #24558e; background: #eef6ff; border: 1px solid #cfe4ff; }

:root[data-theme="dark"] .notice-strip.mint { color: #8cf4d3; background: #0d3027; border-color: #195341; }
:root[data-theme="dark"] .notice-strip.amber { color: #f8d987; background: #302814; border-color: #59471c; }
:root[data-theme="dark"] .notice-strip.red { color: #ffaaaa; background: #32191a; border-color: #5e282a; }
:root[data-theme="dark"] .notice-strip.blue { color: #9bc6fa; background: #14263a; border-color: #244567; }

.setup-card > .notice-strip { margin-top: 18px; }

.setup-actions {
  margin-top: 22px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.error-summary {
  margin-bottom: 18px;
  padding: 12px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  color: #a52727;
  background: #fff0f0;
  border: 1px solid #ffd0d0;
  border-radius: 14px;
}

.error-summary > svg { flex: 0 0 auto; margin-top: 1px; }
.error-summary strong { display: block; font-size: 12px; }
.error-summary p { margin-top: 2px; font-size: 10px; }

/* App shell */

.app-background {
  min-height: 100dvh;
  background:
    radial-gradient(circle at 15% -10%, rgba(63, 199, 161, 0.13), transparent 28%),
    var(--bg);
}

.app-shell {
  width: min(1120px, 100%);
  min-height: 100dvh;
  margin: 0 auto;
  position: relative;
  background: var(--bg);
}

.app-header {
  height: 78px;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(223, 233, 230, 0.78);
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter: blur(18px);
}

:root[data-theme="dark"] .app-header { border-color: rgba(33, 58, 52, 0.8); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.notification-button { position: relative; }
.notification-button i {
  width: 7px;
  height: 7px;
  position: absolute;
  right: 9px;
  top: 8px;
  border: 2px solid var(--surface-2);
  border-radius: 50%;
  background: var(--red);
}

.screen-content {
  min-height: calc(100dvh - 78px);
  padding: 24px 24px 112px;
}

.page-stack {
  display: flex;
  flex-direction: column;
  gap: 20px;
  animation: page-in 280ms ease both;
}

@keyframes page-in {
  from { opacity: 0; transform: translateY(5px); }
}

.page-intro {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
}

.page-intro > div > p,
.section-kicker {
  color: var(--mint-600);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.04em;
}

.page-intro h1 {
  margin-top: 2px;
  font-size: 28px;
  letter-spacing: -0.8px;
}

.page-intro > div > span {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
}

.add-fab {
  min-height: 44px;
  padding: 0 16px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: white;
  background: var(--mint-600);
  border-radius: 14px;
  font-weight: 800;
}

.mobile-add-fab {
  display: none;
}

.card {
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.card-heading,
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.card-heading h2,
.section-header h2 {
  margin-top: 2px;
  font-size: 18px;
  letter-spacing: -0.35px;
}

.section-header > small {
  color: var(--muted);
  font-size: 10px;
}

.completion-panel {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: stretch;
  gap: 10px;
}

.completion-panel > .button { height: auto; min-height: 64px; }

.completion-banner {
  width: 100%;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: #075747;
  text-align: left;
  background: linear-gradient(90deg, #d8f8ed, #edfff9);
  border: 1px solid #b1efda;
  border-radius: 17px;
}

.completion-banner > span {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  color: white;
  background: var(--mint-600);
  border-radius: 12px;
}

.completion-banner p { flex: 1; display: flex; flex-direction: column; }
.completion-banner small { margin-top: 2px; color: #47766a; font-size: 10px; }

.balance-hero {
  min-height: 245px;
  padding: 26px;
  position: relative;
  overflow: hidden;
  color: white;
  border-radius: var(--radius-xl);
  background: linear-gradient(145deg, #0fa77e, #075747 72%);
  box-shadow: 0 22px 48px rgba(8, 112, 87, 0.24);
}

.balance-hero.caution { background: linear-gradient(145deg, #bc8513, #79520b 75%); }
.balance-hero.near { background: linear-gradient(145deg, #db7319, #8c3e09 75%); }
.balance-hero.danger { background: linear-gradient(145deg, #dd4444, #842626 75%); }

.hero-top,
.hero-foot,
.hero-progress {
  position: relative;
  z-index: 2;
}

.hero-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 15px;
}

.hero-top > div {
  display: flex;
  flex-direction: column;
}

.hero-top > div > span {
  opacity: 0.76;
  font-size: 12px;
}

.hero-top > div > strong {
  margin-top: 4px;
  font-size: clamp(38px, 6vw, 54px);
  line-height: 1.1;
  letter-spacing: -2px;
}

.hero-top > div > strong.negative { color: #fff1f1 !important; }

.hero-progress {
  margin-top: 31px;
}

.hero-progress > div {
  height: 8px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.16);
  border-radius: 999px;
}

.hero-progress > div > span {
  height: 100%;
  display: block;
  background: linear-gradient(90deg, #87ffdc, #d2fff0);
  border-radius: inherit;
  transition: width 500ms ease;
}

.hero-progress > p {
  margin-top: 8px;
  display: flex;
  justify-content: space-between;
  opacity: 0.72;
  font-size: 10px;
}

.hero-foot {
  margin-top: 24px;
  display: flex;
  gap: 20px;
}

.hero-foot span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 700;
}

.hero-pattern {
  width: 300px;
  height: 300px;
  position: absolute;
  right: -80px;
  top: -110px;
  border: 55px solid rgba(255, 255, 255, 0.035);
  border-radius: 50%;
}

.hero-pattern::after {
  content: "";
  width: 340px;
  height: 340px;
  position: absolute;
  right: -40px;
  top: 90px;
  border: 30px solid rgba(255, 255, 255, 0.025);
  border-radius: 50%;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.percent-chip {
  min-width: 47px;
  padding: 6px 8px;
  text-align: center;
  border-radius: 999px;
  color: var(--mint-700);
  background: var(--mint-100);
  font-size: 11px;
  font-weight: 900;
}

.percent-chip.caution { color: #8a5a05; background: #fff1bf; }
.percent-chip.near { color: #9a430b; background: #ffdfc4; }
.percent-chip.danger { color: #a52727; background: #ffdada; }

.today-ring-row {
  margin-top: 20px;
  display: grid;
  grid-template-columns: 142px 1fr;
  align-items: center;
  gap: 24px;
}

.progress-ring {
  width: 142px;
  height: 142px;
  padding: 13px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--mint-500) var(--progress), var(--surface-3) 0);
}

.progress-ring::before {
  content: "";
  grid-area: 1 / 1;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--surface);
}

.progress-ring > div {
  grid-area: 1 / 1;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.progress-ring strong { font-size: 21px; }
.progress-ring small { margin-top: 2px; color: var(--muted); font-size: 9px; }

.today-numbers {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.today-numbers span {
  display: flex;
  flex-direction: column;
}

.today-numbers small { color: var(--muted); font-size: 9px; }
.today-numbers strong { margin-top: 2px; font-size: 20px; }

.budget-threshold {
  height: 7px;
  margin-top: 20px;
  overflow: hidden;
  border-radius: 999px;
  background: linear-gradient(90deg, #9ce6c9 70%, #f9dc86 70% 90%, #ffc27f 90%);
}

.budget-threshold span {
  height: 100%;
  display: block;
  background: var(--mint-700);
  border-radius: inherit;
}

.budget-threshold.caution span { background: #c98b0e; }
.budget-threshold.near span { background: var(--orange); }
.budget-threshold.danger span { background: var(--red); }

.threshold-labels {
  margin-top: 5px;
  display: flex;
  justify-content: space-between;
  color: var(--subtle);
  font-size: 8px;
}

.insight-card {
  min-height: 100%;
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: auto 1fr;
  align-content: start;
  gap: 13px;
  background:
    radial-gradient(circle at 100% 0, rgba(63, 199, 161, 0.15), transparent 45%),
    var(--surface);
}

.insight-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  color: var(--mint-700);
  background: var(--mint-100);
  border-radius: 15px;
}

.insight-card h2 { margin-top: 3px; font-size: 20px; }
.insight-card p { margin-top: 10px; color: var(--muted); line-height: 1.75; font-size: 12px; }

.forecast-row {
  grid-column: 1 / -1;
  margin-top: 18px;
  padding-top: 18px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 15px;
  border-top: 1px solid var(--line);
}

.forecast-row > span {
  display: flex;
  flex-direction: column;
}

.forecast-row small { color: var(--muted); font-size: 9px; }
.forecast-row strong { margin-top: 2px; font-size: 20px; }
.forecast-row button {
  padding: 6px 0;
  display: inline-flex;
  align-items: center;
  color: var(--mint-600);
  background: transparent;
  font-size: 10px;
  font-weight: 800;
}

.quick-section {
  padding: 6px 0;
}

.quick-grid {
  margin-top: 13px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.quick-grid button {
  min-height: 92px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 11px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: transform 180ms ease, border 180ms ease;
}

.quick-grid button:hover {
  transform: translateY(-2px);
  border-color: var(--mint-300);
}

.quick-icon,
.metric-icon {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 14px;
}

.quick-icon.mint, .metric-icon.mint { color: #087057; background: #d8f8ed; }
.quick-icon.amber, .metric-icon.amber { color: #9a6506; background: #fff0bd; }
.quick-icon.blue, .metric-icon.blue { color: #2867ae; background: #deedff; }
.quick-icon.violet, .metric-icon.violet { color: #6d42ba; background: #eee5ff; }
.metric-icon.rose { color: #b53270; background: #ffe2ef; }
.metric-icon.red { color: #b62f2f; background: #ffe1e1; }

.quick-grid p { display: flex; flex-direction: column; min-width: 0; }
.quick-grid strong { font-size: 12px; }
.quick-grid small { margin-top: 3px; color: var(--muted); font-size: 9px; }

.lower-grid {
  grid-template-columns: 1.25fr 0.75fr;
}

.legend-dot {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-size: 9px;
}

.legend-dot i {
  width: 18px;
  height: 2px;
  background: var(--amber);
}

.mini-chart {
  height: 240px;
  margin-top: 19px;
}

.chart-plot {
  height: 100%;
  position: relative;
  display: flex;
  align-items: stretch;
  justify-content: space-around;
  gap: 8px;
  border-bottom: 1px solid var(--line);
}

.chart-plot::before,
.chart-plot::after {
  content: "";
  width: 100%;
  position: absolute;
  left: 0;
  border-top: 1px dashed var(--line);
}

.chart-plot::before { top: 30%; }
.chart-plot::after { top: 62%; }

.limit-line {
  width: 100%;
  position: absolute;
  left: 0;
  z-index: 2;
  border-top: 1px dashed var(--amber);
}

.limit-line span {
  padding: 2px 5px;
  position: absolute;
  right: 0;
  top: -18px;
  color: #986305;
  background: #fff6d8;
  border-radius: 5px;
  font-size: 8px;
}

.bar-column {
  width: 100%;
  height: calc(100% - 26px);
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
}

.bar-value {
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 8px;
}

.bar-track {
  width: min(32px, 70%);
  height: 86%;
  display: flex;
  align-items: flex-end;
  border-radius: 9px 9px 3px 3px;
  background: rgba(25, 169, 130, 0.05);
}

.bar-fill {
  width: 100%;
  min-height: 3px;
  border-radius: 9px 9px 3px 3px;
  background: linear-gradient(180deg, var(--mint-300), var(--mint-600));
  transition: height 500ms ease;
}

.bar-fill.over {
  background: linear-gradient(180deg, #ff9c9c, var(--red));
}

.bar-label {
  height: 25px;
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 2px;
  color: var(--muted);
  font-size: 8px;
}

.bar-label small { color: var(--subtle); font-size: 7px; }

.category-summary {
  margin-top: 21px;
  display: flex;
  align-items: center;
  gap: 17px;
}

.category-donut {
  width: 112px;
  height: 112px;
  padding: 12px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--category-color) var(--category-progress), var(--surface-3) 0);
}

.category-donut::before {
  content: "";
  grid-area: 1 / 1;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--surface);
}

.category-donut span {
  grid-area: 1 / 1;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 20px;
  font-weight: 900;
}

.category-donut small { color: var(--muted); font-size: 8px; font-weight: 600; }
.category-summary > div:last-child { display: flex; flex-direction: column; }
.category-summary > div:last-child > small { color: var(--muted); font-size: 9px; }
.category-summary > div:last-child > strong { margin-top: 3px; font-size: 14px; }
.category-summary > div:last-child > p { margin-top: 3px; color: var(--mint-600); font-weight: 800; }

.category-bars {
  margin-top: 21px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.category-bars > div > p {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
}

.category-bars > div > p strong { font-size: 9px; }
.category-bars > div > i {
  height: 5px;
  margin-top: 5px;
  display: block;
  overflow: hidden;
  border-radius: 10px;
  background: var(--surface-3);
}

.category-bars > div > i > span {
  height: 100%;
  display: block;
  border-radius: 10px;
}

.recent-card {
  padding-bottom: 9px;
}

.expense-list {
  margin-top: 13px;
  display: flex;
  flex-direction: column;
}

.expense-row {
  min-height: 70px;
  padding: 12px 3px;
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: 12px;
  border-top: 1px solid var(--line);
}

.expense-list .expense-row:first-child { border-top: 0; }

.expense-category-icon {
  width: 43px;
  height: 43px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 14px;
  font-size: 20px;
}

.expense-main {
  min-width: 0;
}

.expense-main > p {
  display: flex;
  align-items: center;
  gap: 7px;
}

.expense-main strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
}

.expense-main > small {
  display: block;
  margin-top: 3px;
  overflow: hidden;
  color: var(--muted);
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 9px;
}

.expense-amount {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.expense-amount strong { font-size: 12px; }
.expense-amount small { margin-top: 3px; color: var(--muted); font-size: 8px; }

.row-actions {
  display: flex;
  gap: 5px;
}

.row-actions button {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--surface-2);
  border-radius: 10px;
}

.row-actions button:last-child:hover { color: var(--red); background: #fff0f0; }

.empty-state {
  min-height: 190px;
  padding: 25px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.empty-state > span {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  color: var(--mint-700);
  background: var(--mint-100);
  border-radius: 18px;
}

.empty-state h3 { margin-top: 11px; font-size: 14px; }
.empty-state p { margin-top: 4px; color: var(--muted); font-size: 10px; }
.empty-state .button { margin-top: 13px; }

.bottom-nav {
  width: min(1120px, 100%);
  height: 82px;
  padding: 8px max(12px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));
  position: fixed;
  left: 50%;
  bottom: 0;
  z-index: 40;
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  box-shadow: 0 -12px 30px rgba(18, 62, 50, 0.07);
  backdrop-filter: blur(20px);
}

.bottom-nav button {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--subtle);
  background: transparent;
}

.bottom-nav button > span {
  width: 39px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 12px;
}

.bottom-nav button small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 8px;
  font-weight: 700;
}

.bottom-nav button.active { color: var(--mint-700); }
.bottom-nav button.active > span { background: var(--mint-100); }

/* Budget */

.plan-overview-card {
  padding: 24px;
  position: relative;
  overflow: hidden;
  color: white;
  border-radius: 28px;
  background:
    radial-gradient(circle at 90% 0, rgba(255, 255, 255, 0.13), transparent 30%),
    linear-gradient(145deg, #173f34, #09271f);
  box-shadow: var(--shadow-md);
}

.plan-overview-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 15px;
}

.plan-overview-top > div > .simulation-badge {
  color: white;
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.16);
}

.plan-overview-top h2 { margin-top: 8px; font-size: 22px; }
.plan-overview-top p { margin-top: 4px; opacity: 0.65; font-size: 10px; }

.plan-overview-stats {
  margin-top: 24px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.plan-overview-stats span {
  padding: 12px;
  display: flex;
  flex-direction: column;
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.06);
}

.plan-overview-stats small { opacity: 0.58; font-size: 8px; }
.plan-overview-stats strong { margin-top: 4px; font-size: 16px; }
.plan-overview-stats .negative { color: #ffb8b8 !important; }

.plan-overview-progress {
  height: 6px;
  margin-top: 19px;
  overflow: hidden;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.12);
}

.plan-overview-progress span {
  height: 100%;
  display: block;
  border-radius: inherit;
  background: #82f3ce;
}

.segment-control,
.scan-mode-tabs {
  padding: 5px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface-3);
}

.segment-control button,
.scan-mode-tabs button {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: var(--muted);
  background: transparent;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 800;
}

.segment-control button.active,
.scan-mode-tabs button.active {
  color: var(--mint-700);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.history-card { padding: 22px; }

.history-filters {
  margin-top: 15px;
  display: grid;
  grid-template-columns: 1.5fr repeat(3, minmax(130px, 0.7fr));
  gap: 9px;
}

.history-filters input,
.history-filters select {
  min-width: 0;
  padding: 0 10px;
  font-size: 10px;
}

.search-field {
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface-2);
}

.search-field svg { flex: 0 0 auto; color: var(--muted); }
.search-field input {
  min-height: 44px;
  padding: 0;
  border: 0;
  background: transparent;
  box-shadow: none !important;
}

.analysis-stack {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.analysis-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.metric-card {
  min-height: 150px;
  padding: 17px;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.metric-icon {
  margin-bottom: 16px;
}

.metric-card > small { color: var(--muted); font-size: 9px; }
.metric-card > strong { margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 17px; }
.metric-card > p { margin-top: 3px; color: var(--muted); font-size: 9px; }
.full-chart .mini-chart { height: 280px; }

.insight-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.summary-button { align-self: center; }

/* Scanner */

.scan-workspace {
  display: grid;
  grid-template-columns: 1fr 0.82fr;
  align-items: start;
  gap: 18px;
}

.scan-main-card {
  padding: 22px;
}

.slip-upload {
  min-height: 280px;
  margin-top: 17px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border: 1.5px dashed var(--mint-300);
  border-radius: 22px;
  background: var(--mint-50);
}

.slip-upload > span {
  width: 59px;
  height: 59px;
  display: grid;
  place-items: center;
  color: var(--mint-700);
  background: var(--surface);
  border-radius: 19px;
  box-shadow: var(--shadow-sm);
}

.slip-upload h3 { margin-top: 13px; font-size: 15px; }
.slip-upload p { margin-top: 4px; color: var(--muted); font-size: 9px; }
.slip-upload .button { margin-top: 17px; }
.slip-upload input { display: none; }

.slip-upload.has-preview {
  padding: 15px;
}

.slip-upload.has-preview img {
  width: auto;
  height: 205px;
  object-fit: contain;
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
}

.slip-upload.has-preview .button { margin-top: 12px; }

.scan-main-card > .full-button { margin-top: 13px; }

.local-note {
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  color: var(--muted);
  text-align: center;
  font-size: 8px;
}

.sample-panel {
  padding: 4px 0;
}

.place-provider { margin-top: 5px; display: block; color: var(--mint-600); font-size: 8px; font-weight: 750; }

.scan-history-panel { padding: 4px 0; }

.scan-history-list {
  margin-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.scan-history-item {
  width: 100%;
  min-height: 72px;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.scan-history-item:hover { border-color: var(--mint-300); background: var(--mint-50); }
.scan-history-item > span:nth-child(2) { min-width: 0; display: flex; flex-direction: column; }
.scan-history-item strong { overflow: hidden; }
  </style>
</head>

  <div id="app"></div>
