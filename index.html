      + '<section class="restaurant-section"><div class="section-header"><div><span class="section-kicker">' + (ui.location.fromGps ? "ร้านใกล้คุณ" : "ร้านใกล้จุดอ้างอิง") + ' · เรียงจากใกล้ไปไกล</span><h2>ข้อมูลร้านสำรองจาก OpenStreetMap</h2></div><small>' + places.length + ' ร้าน · ชุดข้อมูลสาธารณะ</small></div><p class="restaurant-source-note">ชุดสำรองจาก Source เวอร์ชัน 6 — ไม่ใช่ข้อมูลผู้ใช้และไม่ใช่ข้อมูลสด</p>'
      + (cards ? '<div class="restaurant-list">' + cards + '</div>' : emptyState("store", "ยังไม่พบร้านที่ตรงเงื่อนไข", "ลองเพิ่มรัศมี ปิดตัวกรอง หรือค้นหาคำอื่น"))
      + '</section></div>';
  }

  function scanHistoryHtml(mode) {
    var history = state.expenses.filter(function (expense) { return expense.method === mode; })
      .sort(function (a, b) { return (b.date + "T" + b.time).localeCompare(a.date + "T" + a.time); })
      .slice(0, 8);
    return '<div class="scan-history-panel"><div class="section-header"><div><span class="section-kicker">บันทึกอยู่ในเครื่อง</span><h2>ประวัติ' + (mode === "slip" ? "สลิป" : " QR รายจ่าย") + '</h2></div><small>' + history.length + ' รายการล่าสุด</small></div>'

    var qrPanel = '<section class="scan-workspace"><div class="scan-main-card card"><div class="card-heading"><div><span class="section-kicker">กล้องในเบราว์เซอร์</span><h2>สแกน QR ข้อมูลรายจ่าย</h2></div></div>'

      + '<small class="local-note">' + icon("warning", 15) + ' ระบบปฏิเสธ PromptPay, QR Payment และข้อความที่ไม่ใช่ paotung-expense v1</small></div>'

      + notice("amber", "warning", "เมนูนี้ใช้กรอกข้อมูลรายจ่ายเท่านั้น ไม่ใช่ QR Payment และไม่สามารถทำธุรกรรมใด ๆ")

  function renderProfile() {
    var metrics = getBudgetMetrics(state.plan, state.expenses);

      var spent = archive.expenses.reduce(function (sum, expense) { return sum + expense.amount; }, 0);
      return '<article><span class="cycle-icon">' + icon("history") + '</span><div><strong>' + escapeHtml(archive.plan.name) + '</strong><small>' + formatThaiDate(archive.plan.startDate, true) + ' – ' + formatThaiDate(endDateOf(archive.plan), true) + ' · ' + archive.expenses.length + ' รายการ</small></div><span><small>ใช้ไป</small><b>฿' + formatMoney(spent) + '</b></span></article>';
    }).join("");
    return '<div class="profile-page page-stack"><section class="profile-hero"><span class="profile-avatar">' + escapeHtml(state.nickname ? state.nickname.slice(0, 1) : "฿") + '</span><div><span class="version-chip">v3</span><h1>' + escapeHtml(state.nickname || "ผู้ใช้เป๋าตุง") + '</h1><p>ผู้ใช้งานต้นแบบ · มหาวิทยาลัยขอนแก่น</p></div><span class="local-profile">โปรไฟล์ในเครื่อง</span></section>'
      + '<section class="profile-summary"><div><small>แผนปัจจุบัน</small><strong>' + escapeHtml(state.plan.name) + '</strong></div><span><small>คงเหลือ</small><strong class="' + (metrics.remaining < 0 ? "text-danger" : "") + '">฿' + formatMoney(metrics.remaining) + '</strong></span>' + statusBadge(metrics.status) + '</section>'
      + '<section class="cycle-history-section"><div class="section-header"><div><span class="section-kicker">ใช้ซ้ำได้ทุกครั้ง</span><h2>ประวัติรอบงบประมาณ</h2></div><small>' + state.archives.length + ' รอบที่เก็บไว้</small></div>' + (history ? '<div class="cycle-history-list">' + history + '</div>' : '<p class="cycle-empty">เมื่อเริ่มแผนรอบใหม่ แผนเดิมและรายจ่ายทั้งหมดจะถูกเก็บไว้ตรงนี้อัตโนมัติ</p>') + '</section>'
      + '<section class="settings-group"><h2>รอบงบประมาณ</h2><button class="setting-row start-cycle-row" data-action="new-plan"><span class="setting-icon">' + icon("history") + '</span><p><strong>เก็บรอบนี้และเริ่มแผนใหม่</strong><small>ไม่ต้องรีเซ็ต แผนเดิมจะย้ายไปประวัติอัตโนมัติ</small></p>' + icon("chevron") + '</button><button class="setting-row" data-action="summary"><span class="setting-icon">' + icon("sparkles") + '</span><p><strong>ดูสรุปแผน ' + state.plan.days + ' วัน</strong><small>ผลลัพธ์ กราฟ และข้อเสนอแนะรอบถัดไป</small></p>' + icon("chevron") + '</button></section>'
      + '<section class="settings-group"><h2>การแสดงผล</h2><label class="setting-row nickname-setting"><span class="setting-icon">' + icon("user") + '</span><p><strong>ชื่อเล่น</strong><small>ไม่บังคับ เก็บไว้เฉพาะในเบราว์เซอร์นี้</small></p><input id="profile-nickname" value="' + escapeAttr(state.nickname) + '" maxlength="30" placeholder="ยังไม่ได้ตั้ง" aria-label="แก้ไขชื่อเล่น"></label><button class="setting-row" data-action="toggle-theme"><span class="setting-icon">' + icon(state.theme === "light" ? "moon" : "sun") + '</span><p><strong>โหมดสี</strong><small>' + (state.theme === "light" ? "สว่าง" : "มืด") + ' · รองรับตามความชอบของคุณ</small></p><span class="switch ' + (state.theme === "dark" ? "on" : "") + '"><i></i></span></button></section>'
      + '<section class="settings-group"><h2>ข้อมูลในอุปกรณ์</h2><div class="setting-row static"><span class="setting-icon">' + icon("wallet") + '</span><p><strong>บันทึกบนอุปกรณ์นี้</strong><small>แผนปัจจุบันและประวัติ ' + state.archives.length + ' รอบยังอยู่หลัง Refresh หน้าเว็บ</small></p><span class="safe-label">ในเครื่อง</span></div><button class="setting-row danger-row" data-action="reset"><span class="setting-icon">' + icon("history") + '</span><p><strong>ล้างข้อมูลทั้งหมดในเครื่อง</strong><small>ใช้เฉพาะเมื่อต้องการลบแผน ประวัติ ชื่อเล่น และร้านโปรดทั้งหมด</small></p>' + icon("chevron") + '</button></section>'

      var detail = categoryMeta(expense.categoryId);
      return '<div class="expense-review">' + notice("amber", "warning", "นี่คือการบันทึกข้อมูลเท่านั้น ไม่มีการตัดเงินหรือส่งคำสั่งซื้อจริง")

        + '<dl class="review-list"><div><dt>รายการ</dt><dd>' + escapeHtml(expense.name) + '</dd></div><div><dt>หมวดหมู่</dt><dd>' + detail.label + '</dd></div><div><dt>ร้าน</dt><dd>' + escapeHtml(expense.store || "ไม่ระบุร้าน") + '</dd></div><div><dt>วันที่และเวลา</dt><dd>' + formatThaiDate(expense.date, true) + ' · ' + escapeHtml(expense.time) + '</dd></div><div><dt>วิธีบันทึก</dt><dd>' + escapeHtml(METHOD_LABELS[expense.method]) + (expense.isSample ? " " + simulationBadge(true) : "") + '</dd></div>' + (expense.note ? '<div><dt>หมายเหตุ</dt><dd>' + escapeHtml(expense.note) + '</dd></div>' : "") + '</dl>'

    }
    var activeMethod = expense.method === "restaurant" ? "food" : expense.method;
    var methods = [
      ["manual", "กรอกเอง", "edit"],
      ["food", "ร้านอาหาร", "store"],
      ["slip", "รูปสลิป", "receipt"],
      ["qr", "QR รายจ่าย", "qr"]

      + '<div id="expense-errors"></div><form class="expense-form" id="expense-form"><label class="field"><span>ชื่อรายการ *</span><input name="name" value="' + escapeAttr(expense.name) + '" placeholder="เช่น ข้าวกะเพรา"></label>'
      + '<div class="form-row"><label class="field"><span>จำนวนเงิน *</span><div class="money-input"><b>฿</b><input name="amount" inputmode="decimal" type="number" min="0.01" step="0.01" value="' + (expense.amount || "") + '" placeholder="0.00"></div></label><label class="field"><span>หมวดหมู่ *</span><select name="categoryId">' + categoryOptions(expense.categoryId) + '</select></label></div>'
      + '<label class="field"><span>ชื่อร้าน</span><input name="store" value="' + escapeAttr(expense.store) + '" placeholder="ไม่ระบุก็ได้"></label>'
      + '<div class="form-row"><label class="field"><span>วันที่ *</span><input name="date" type="date" min="' + state.plan.startDate + '" max="' + endDateOf(state.plan) + '" value="' + expense.date + '"></label><label class="field"><span>เวลา *</span><input name="time" type="time" value="' + expense.time + '"></label></div>'
      + '<label class="field"><span>หมายเหตุ</span><textarea name="note" rows="3" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)">' + escapeHtml(expense.note) + '</textarea></label>'
      + '<div class="record-method"><span>' + icon("check", 16) + ' วิธีบันทึก</span><strong>' + escapeHtml(METHOD_LABELS[expense.method]) + '</strong>' + (expense.isSample ? simulationBadge(true) : "") + '</div>'
      + '<div class="review-actions"><button type="button" class="button secondary" data-action="close-overlay">ยกเลิก</button><button type="submit" class="button primary">ตรวจสอบรายการ ' + icon("chevron") + '</button></div></form></div>';

  function summaryHtml() {

    return '<div class="summary-content">' + (!metrics.planComplete ? notice("blue", "sparkles", "แผนยังไม่ครบกำหนด หน้านี้แสดงผลสรุปจากข้อมูลปัจจุบัน") : "")
      + '<section class="summary-result ' + (survived ? "survived" : "over") + '"><div class="summary-celebration">' + (survived ? "🎉" : "🧭") + '</div>' + simulationBadge(false) + '<h2>' + (survived ? "รอดตามงบ!" : "ใช้เกินงบ") + '</h2><p>' + (survived ? "คุณยังเหลือเงินเมื่อสิ้นสุดข้อมูลในแผน" : "ยอดรายจ่ายรวมมากกว่างบตั้งต้น") + '</p><strong>' + (survived ? "เหลือ ฿" + formatMoney(metrics.remaining) : "เกิน ฿" + formatMoney(Math.abs(metrics.remaining))) + '</strong></section>'
      + '<section class="summary-stat-grid"><article><small>งบเริ่มต้น</small><strong>฿' + formatMoney(plan.totalBudget) + '</strong></article><article><small>ยอดใช้ทั้งหมด</small><strong>฿' + formatMoney(metrics.totalSpent) + '</strong></article><article><small>เฉลี่ยต่อวัน</small><strong>฿' + formatMoney(metrics.averageDaily) + '</strong></article><article><small>วันที่เกินวงเงิน</small><strong>' + metrics.overDays + ' วัน</strong></article></section>'

  function attemptCommitExpense() {
    if (!ui.editor) return;
    var expense = ui.editor.expense;
    var isEdit = ui.editor.isEdit;
    var others = state.expenses.filter(function (item) { return item.id !== expense.id; });
    var duplicate = others.some(function (item) {
      return item.name.trim().toLowerCase() === expense.name.trim().toLowerCase()
        && item.amount === expense.amount
        && item.date === expense.date
        && item.store.trim().toLowerCase() === expense.store.trim().toLowerCase();
    });
    var daySpent = others.filter(function (item) { return item.date === expense.date; })
      .reduce(function (sum, item) { return sum + item.amount; }, 0);
    var overAmount = Math.max(0, daySpent + expense.amount - state.plan.dailyLimit);
    var projected = others.reduce(function (sum, item) { return sum + item.amount; }, 0) + expense.amount;
    var deficit = Math.max(0, projected - state.plan.totalBudget);
    if (duplicate || overAmount > 0 || deficit > 0) {
      ui.modal = {
        type: "expense-warning",
        warning: {
          expense: expense,
          isEdit: isEdit,
          duplicate: duplicate,
          overAmount: overAmount,
          deficit: deficit,
          editor: ui.editor
        }
      };
      ui.editor = null;
      render();
      return;
    }
    finalizeExpense(expense, isEdit);
  }

  function finalizeExpense(expense, isEdit) {
    var others = state.expenses.filter(function (item) { return item.id !== expense.id; });
    var projected = others.reduce(function (sum, item) { return sum + item.amount; }, 0) + expense.amount;
    if (isEdit) {
      state.expenses = state.expenses.map(function (item) { return item.id === expense.id ? expense : item; });
    } else {
      state.expenses.unshift(expense);
    }
    ui.editor = null;
    ui.modal = null;
    ui.scanResult = null;
    ui.activeTab = "home";
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, "", window.location.pathname + window.location.search + "#home");
    }
    persist();
    showToast(projected > state.plan.totalBudget ? "บันทึกแล้ว แต่งบประมาณหมดและยอดคงเหลือติดลบ" : isEdit ? "แก้ไขรายจ่ายสำเร็จ" : "บันทึกรายจ่ายสำเร็จ", projected > state.plan.totalBudget ? "danger" : "success");
  }

  function parseExpenseQr(raw) {
    var normalized = String(raw || "").trim();
    if (!normalized) return { ok: false, error: "QR ไม่มีข้อมูล" };
    if (/000201|promptpay|payment|merchant presented|พร้อมเพย์/i.test(normalized)) {
      return { ok: false, error: "QR นี้อาจเป็น QR สำหรับการเงิน เป๋าตุงไม่รองรับการชำระเงิน" };
    }
    var value;
    try { value = JSON.parse(normalized); }
    catch (error) { return { ok: false, error: "รองรับเฉพาะ QR ข้อมูลรายจ่ายของเป๋าตุง" }; }
    if (!value || typeof value !== "object") return { ok: false, error: "รูปแบบ QR ไม่ถูกต้อง" };
    if (value.type !== "paotung-expense" || value.version !== 1) return { ok: false, error: "QR นี้ไม่ใช่ข้อมูลรายจ่ายเวอร์ชันที่รองรับ" };
    if (typeof value.name !== "string" || !value.name.trim()) return { ok: false, error: "QR ไม่มีชื่อรายการ" };
    if (!Number.isFinite(Number(value.amount)) || Number(value.amount) <= 0) return { ok: false, error: "จำนวนเงินใน QR ไม่ถูกต้อง" };
    if (!CATEGORIES.some(function (item) { return item.id === value.categoryId; })) return { ok: false, error: "หมวดหมู่ใน QR ไม่ถูกต้อง" };
    return {
      ok: true,
      data: {
        name: value.name.trim().slice(0, 120),
        amount: Number(value.amount),
        categoryId: value.categoryId,
        store: typeof value.merchant === "string" ? value.merchant.slice(0, 120) : "",
        date: typeof value.date === "string" && isDateInPlan(value.date, state.plan) ? value.date : safeExpenseDate(),
        time: /^([01]\d|2[0-3]):[0-5]\d$/.test(value.time || "") ? value.time : "12:00",
        method: "qr",
        note: typeof value.note === "string" ? value.note.slice(0, 240) : "ข้อมูลจาก QR รายจ่าย — ไม่ใช่ QR Payment"
      }
    };
  }

  function applyQrText(raw) {
    var parsed = parseExpenseQr(raw);
    if (!parsed.ok) {
      ui.scanError = parsed.error;
      ui.scanResult = null;
    } else {
      ui.scanError = "";
      ui.scanResult = parsed.data;
    }
    stopCamera();
    render();
  }

  async function decodeQrFile(file) {
    ui.scanError = "";
    if (!("BarcodeDetector" in window)) {
      ui.scanError = "เบราว์เซอร์นี้ยังไม่รองรับ BarcodeDetector กรุณาวางข้อความ JSON จาก QR ในช่องด้านล่าง";
      render();
      return;
    }
    try {
      var detector = new window.BarcodeDetector({ formats: ["qr_code"] });
      var bitmap = await createImageBitmap(file);
      var results = await detector.detect(bitmap);
      if (bitmap.close) bitmap.close();
      if (!results.length) throw new Error("not found");
      applyQrText(results[0].rawValue);
    } catch (error) {
      ui.scanError = "ไม่พบ QR ที่อ่านได้ในภาพนี้";
      render();
    }
  }

  async function startQrCamera() {
    stopCamera();
    ui.cameraMessage = "";
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      ui.cameraStatus = "unavailable";
      ui.cameraMessage = "เบราว์เซอร์นี้ไม่รองรับกล้อง กรุณาอัปโหลดภาพหรือวาง JSON แทน";
      render();
      return;
    }
    if (!("BarcodeDetector" in window)) {
      ui.cameraStatus = "unavailable";
      ui.cameraMessage = "เบราว์เซอร์นี้เปิดกล้องได้แต่ไม่มีตัวอ่าน QR แบบ Native กรุณาอัปโหลดภาพหรือวาง JSON แทน";
      render();
      return;
    }
    ui.cameraStatus = "requesting";
    render();
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });
      ui.cameraStatus = "scanning";
      render();
      var video = document.getElementById("qr-video");
      if (!video) throw new Error("video unavailable");
      video.srcObject = cameraStream;
      await video.play();
      var detector = new window.BarcodeDetector({ formats: ["qr_code"] });
      var scanning = false;
      var loop = async function () {
        if (!cameraStream || ui.cameraStatus !== "scanning") return;
        if (!scanning && video.readyState >= 2) {
          scanning = true;
          try {
            var results = await detector.detect(video);
            if (results.length) {
              applyQrText(results[0].rawValue);
              return;
            }
          } catch (error) { /* continue scanning */ }
          scanning = false;
        }
        cameraLoop = requestAnimationFrame(loop);
      };
      cameraLoop = requestAnimationFrame(loop);
    } catch (error) {
      stopCamera();
      ui.cameraStatus = "error";
      ui.cameraMessage = error && (error.name === "NotAllowedError" || error.name === "SecurityError")
        ? "ยังไม่ได้รับสิทธิ์ใช้กล้อง กรุณาอนุญาตหรืออัปโหลดภาพ QR"
        : "เปิดกล้องไม่สำเร็จ กรุณาอัปโหลดภาพหรือวาง JSON แทน";
      render();
    }
  }

  function requestLocation() {
    if (!navigator.geolocation) {
      ui.locationStatus = "unsupported";
      ui.locationMessage = "เบราว์เซอร์นี้ไม่รองรับการอ่านตำแหน่ง ระบบยังใช้จุดอ้างอิงกลาง มข. ได้";
      render();

    }
    ui.locationStatus = "requesting";
    ui.locationMessage = "กำลังรอให้คุณอนุญาตตำแหน่ง…";
    render();
    navigator.geolocation.getCurrentPosition(function (position) {
      var accuracy = Math.round(position.coords.accuracy);
      ui.location = {
        lat: position.coords.latitude,
        lng: position.coords.longitude,
        label: "ตำแหน่งจริงของคุณ · แม่นยำประมาณ " + accuracy + " ม.",
        fromGps: true,
        accuracy: accuracy
      };
      ui.locationStatus = "active";
      ui.locationMessage = "อัปเดตล่าสุด " + new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }) + " · ร้านเรียงจากใกล้ไปไกล";
      render();
    }, function (error) {
      ui.locationStatus = "error";
      ui.locationMessage = error.code === 1
        ? "เบราว์เซอร์ปฏิเสธสิทธิ์ตำแหน่ง กรุณาเปิดสิทธิ์แล้วลองอีกครั้ง"
        : error.code === 2 ? "ยังหาพิกัดจากอุปกรณ์ไม่ได้ กรุณาเปิด GPS แล้วลองอีกครั้ง"
          : error.code === 3 ? "ใช้เวลาหาพิกัดนานเกินไป กรุณาลองอีกครั้ง"
            : "ไม่สามารถอ่านตำแหน่งได้ในขณะนี้";
      render();
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }

  function collectPlan(form) {
    var data = new FormData(form);

      id: state.plan.id,

      totalBudget: Number(data.get("totalBudget")),

      startDate: String(data.get("startDate") || ""),
      dailyLimit: Number(data.get("dailyLimit"))
    };

  function submitPlan(form) {
    var mode = form.getAttribute("data-mode");
    var plan = collectPlan(form);
    var errors = validatePlan(plan);
    if (errors.length) {
      showInlineErrors("plan-errors", errors);
      return;
    }
    if (mode === "edit") {
      var invalidDate = state.expenses.some(function (expense) { return !isDateInPlan(expense.date, plan); });
      if (invalidDate) {
        showInlineErrors("plan-errors", ["ยังแก้ช่วงแผนไม่ได้ เพราะมีรายจ่ายอยู่นอกช่วงวันที่ใหม่"]);
        return;
      }
      state.plan = plan;
      ui.modal = null;
      persist();
      showToast("อัปเดตแผนงบประมาณแล้ว");
      return;
    }
    var data = new FormData(form);
    var nextPlan = Object.assign({}, plan, { id: makeId("plan") });
    if (ui.setupFromApp) {
      state.archives.unshift({
        id: makeId("archive"),
        plan: Object.assign({}, state.plan),
        expenses: state.expenses.map(function (expense) { return Object.assign({}, expense); }),
        archivedAt: new Date().toISOString()
      });
      state.archives = state.archives.slice(0, 24);
    } else {
      state.favorites = [];
    }
    var includeDemo = data.get("includeDemo") === "on";
    state.plan = nextPlan;
    state.expenses = includeDemo ? createDemoExpenses(nextPlan) : [];
    state.nickname = String(data.get("nickname") || state.nickname || "").trim().slice(0, 30);
    state.nicknamePromptDismissed = Boolean(state.nickname);
    state.started = true;
    ui.setupFromApp = false;
    screen = "app";
    ui.activeTab = "home";
    persist();
    showToast(includeDemo ? "สร้างแผนพร้อมข้อมูลตัวอย่าง 15 รายการแล้ว" : "สร้างแผนงบประมาณสำเร็จ");
  }

  function updatePlanPreview() {
    var budgetInput = document.getElementById("setup-budget");
    var daysInput = document.getElementById("setup-days");
    var limitInput = document.getElementById("setup-limit");
    if (!budgetInput || !daysInput || !limitInput) return;
    var budget = Number(budgetInput.value) || 0;
    var days = Number(daysInput.value) || 0;
    var average = days > 0 ? budget / days : 0;
    if (document.activeElement !== limitInput) limitInput.value = average ? average.toFixed(2) : "";
    var budgetPreview = document.getElementById("preview-budget");
    var daysPreview = document.getElementById("preview-days");
    var averagePreview = document.getElementById("preview-average");
    var hint = document.getElementById("average-hint");
    if (budgetPreview) budgetPreview.textContent = "฿" + formatMoney(budget);
    if (daysPreview) daysPreview.textContent = days + " วัน";
    if (averagePreview) averagePreview.textContent = "฿" + formatMoney(average);
    if (hint) hint.textContent = "ค่าเฉลี่ยแนะนำ " + formatMoney(average) + " บาท/วัน";
  }

  document.addEventListener("submit", function (event) {
    var form = event.target;
    if (!(form instanceof HTMLFormElement)) return;
    event.preventDefault();
    if (form.id === "plan-form") {
      submitPlan(form);
      return;
    }
    if (form.id === "nickname-form") {
      var nicknameData = new FormData(form);
      state.nickname = String(nicknameData.get("nickname") || "").trim().slice(0, 30);
      if (state.nickname) {
        state.nicknamePromptDismissed = true;
        persist();
        showToast("บันทึกชื่อเล่นแล้ว");
      }
      return;
    }
    if (form.id === "expense-form" && ui.editor) {
      var expense = formExpense(form, ui.editor.expense);
      var errors = validateExpense(expense, state.plan);
      if (errors.length) {
        showInlineErrors("expense-errors", errors);
        return;
      }
      ui.editor.expense = expense;
      ui.editor.stage = "review";
      render();
      return;
    }
    if (form.id === "scan-result-form" && ui.scanResult) {
      var scanData = new FormData(form);
      openExpenseEditor({
        name: String(scanData.get("name") || ""),
        amount: Number(scanData.get("amount")),
        categoryId: String(scanData.get("categoryId") || "other"),
        store: String(scanData.get("store") || ""),
        date: String(scanData.get("date") || safeExpenseDate()),
        time: String(scanData.get("time") || currentTime()),
        method: ui.scanResult.method,
        note: ui.scanResult.note || ""
      }, false);
      return;
    }
    if (form.id === "qr-text-form") {
      var qrData = new FormData(form);
      applyQrText(String(qrData.get("qrText") || ""));
    }
  });

  document.addEventListener("click", function (event) {
    var target = event.target.closest("[data-action], [data-tab], [data-method], [data-budget-section], [data-scan-mode]");
    if (!target) return;
    var tab = target.getAttribute("data-tab");
    if (tab) {
      navigate(tab);
      return;
    }
    var method = target.getAttribute("data-method");
    if (method) {
      if (method === "manual") {
        if (ui.editor) {
          ui.editor.expense.method = "manual";
          render();
        } else {
          openExpenseEditor({}, false);
        }
      } else if (method === "food") {
        ui.editor = null;
        navigate("stores");
      } else {
        ui.editor = null;
        ui.scanMode = method;
        navigate("scan");
      }
      return;
    }
    var budgetSection = target.getAttribute("data-budget-section");
    if (budgetSection) {
      ui.budgetSection = budgetSection;
      render();
      return;
    }
    var scanMode = target.getAttribute("data-scan-mode");
    if (scanMode) {
      stopCamera();
      ui.scanMode = scanMode;
      ui.scanResult = null;
      ui.scanError = "";
      render();
      return;
    }
    var action = target.getAttribute("data-action");
    if (!action) return;
    if (action === "start") {
      ui.setupFromApp = false;
      screen = "setup";
      render();
    } else if (action === "back-setup") {
      screen = ui.setupFromApp ? "app" : "welcome";
      ui.setupFromApp = false;
      render();
    } else if (action === "toggle-theme") {
      state.theme = state.theme === "light" ? "dark" : "light";
      persist();
      render();
    } else if (action === "notify") {
      var metrics = getBudgetMetrics(state.plan, state.expenses);
      showToast("วันนี้คุณใช้ไป " + Math.round(metrics.todayUsagePercent) + "% ของวงเงินรายวัน", metrics.todayUsagePercent > 90 ? "warning" : "info");
    } else if (action === "dismiss-nickname") {
      state.nicknamePromptDismissed = true;
      persist();
      render();
    } else if (action === "add-expense") {
      openExpenseEditor({}, false);
    } else if (action === "edit-plan") {
      ui.modal = { type: "plan-editor" };
      render();
    } else if (action === "summary") {
      ui.modal = { type: "summary" };
      render();
    } else if (action === "new-plan") {
      ui.modal = { type: "new-plan" };
      ui.editor = null;
      render();
    } else if (action === "reset") {
      ui.modal = { type: "reset" };
      render();
    } else if (action === "close-overlay" || action === "close-modal") {
      closeOverlay();
    } else if (action === "edit-expense") {
      var editExpense = state.expenses.find(function (item) { return item.id === target.getAttribute("data-id"); });
      if (editExpense) openExpenseEditor(Object.assign({}, editExpense), true);
    } else if (action === "delete-expense") {
      ui.modal = { type: "delete", id: target.getAttribute("data-id") };
      render();
    } else if (action === "confirm-delete") {
      state.expenses = state.expenses.filter(function (expense) { return expense.id !== ui.modal.id; });
      ui.modal = null;
      persist();
      showToast("ลบรายการและคำนวณยอดใหม่แล้ว", "info");
    } else if (action === "confirm-new-plan") {
      ui.modal = null;
      ui.setupFromApp = true;
      screen = "setup";
      render();
    } else if (action === "confirm-reset") {
      stopCamera();
      if (ui.slipPreview && ui.slipPreview.indexOf("blob:") === 0) URL.revokeObjectURL(ui.slipPreview);
      localStorageAdapter.clear();
      state = defaultState();
      screen = "welcome";
      ui.activeTab = "home";
      ui.modal = null;
      ui.editor = null;
      ui.slipPreview = null;
      ui.scanResult = null;
      render();
      showToast("รีเซ็ตข้อมูลในเครื่องแล้ว", "info");
    } else if (action === "editor-back") {
      if (ui.editor) ui.editor.stage = "form";
      render();
    } else if (action === "commit-expense") {
      attemptCommitExpense();
    } else if (action === "warning-back") {
      if (ui.modal && ui.modal.warning) {
        ui.editor = ui.modal.warning.editor;
        ui.editor.stage = "form";
      }
      ui.modal = null;
      render();
    } else if (action === "warning-cancel") {
      ui.modal = null;
      ui.editor = null;
      render();
    } else if (action === "warning-confirm") {
      var warning = ui.modal.warning;
      finalizeExpense(warning.expense, warning.isEdit);
    } else if (action === "request-location") {
      requestLocation();
    } else if (action === "favorites-only") {
      ui.favoritesOnly = !ui.favoritesOnly;
      render();
    } else if (action === "favorite-store") {
      event.stopPropagation();
      var favoriteId = target.getAttribute("data-id");
      state.favorites = state.favorites.indexOf(favoriteId) >= 0
        ? state.favorites.filter(function (item) { return item !== favoriteId; })
        : state.favorites.concat([favoriteId]);
      persist();
      render();
    } else if (action === "select-store") {
      ui.modal = { type: "store", id: target.getAttribute("data-id") };
      render();
    } else if (action === "expense-from-store") {
      var place = restaurantRecords(ui.location).find(function (item) { return item.placeId === target.getAttribute("data-id"); });
      if (place) {
        openExpenseEditor({
          store: place.name,
          categoryId: "food",
          method: "restaurant",
          note: "เลือกร้านจากข้อมูลสถานที่สาธารณะ — ไม่มีคำสั่งซื้อหรือธุรกรรมจริง"
        }, false);
      }
    } else if (action === "read-slip") {
      if (ui.slipPreview) {
        ui.scanResult = {
          name: "",
          amount: 0,
          categoryId: "other",
          store: "",
          date: safeExpenseDate(),
          time: currentTime(),
          method: "slip",
          note: "แนบจากรูปสลิปในอุปกรณ์ กรุณากรอกข้อมูลตามภาพและตรวจสอบก่อนบันทึก"
        };
        render();
      }
    } else if (action === "clear-scan-result") {
      ui.scanResult = null;
      render();
    } else if (action === "reuse-expense") {
      var old = state.expenses.find(function (item) { return item.id === target.getAttribute("data-id"); });
      if (old) {
        openExpenseEditor({
          name: old.name,
          amount: old.amount,
          categoryId: old.categoryId,
          store: old.store,
          method: old.method,
          note: "ใช้ข้อมูลจากประวัติวันที่ " + formatThaiDate(old.date)
        }, false);
      }
    } else if (action === "start-camera") {
      startQrCamera();
    } else if (action === "stop-camera") {
      stopCamera();
      render();
    }
  });

  document.addEventListener("input", function (event) {
    var target = event.target;
    if (!(target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target instanceof HTMLSelectElement)) return;
    if (target.id === "setup-budget" || target.id === "setup-days") {
      updatePlanPreview();
      return;
    }
    if (target.id === "budget-search") {
      ui.budgetSearch = target.value;
      render("budget-search");
      return;
    }
    if (target.id === "store-search") {
      ui.storeSearch = target.value;
      render("store-search");
    }
  });

  document.addEventListener("change", function (event) {
    var target = event.target;
    if (!(target instanceof HTMLInputElement || target instanceof HTMLSelectElement)) return;
    if (target.id === "budget-category") {
      ui.budgetCategory = target.value;
      render();
    } else if (target.id === "budget-date") {
      ui.budgetDate = target.value;
      render();
    } else if (target.id === "budget-sort") {
      ui.budgetSort = target.value;
      render();
    } else if (target.id === "store-radius") {
      ui.storeRadius = Number(target.value);
      render();
    } else if (target.id === "store-kind") {
      ui.storeKind = target.value;
      render();
    } else if (target.id === "profile-nickname") {
      state.nickname = target.value.trim().slice(0, 30);
      state.nicknamePromptDismissed = Boolean(state.nickname);
      persist();
      render();
    } else if (target.id === "slip-file" && target.files && target.files[0]) {
      if (ui.slipPreview && ui.slipPreview.indexOf("blob:") === 0) URL.revokeObjectURL(ui.slipPreview);
      ui.slipPreview = URL.createObjectURL(target.files[0]);
      ui.scanResult = null;
      render();
    } else if (target.id === "qr-file" && target.files && target.files[0]) {
      decodeQrFile(target.files[0]);
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && (ui.editor || ui.modal)) closeOverlay();
  });

  /*
   * Small deterministic test surface used only by the included verification
   * script. It exposes pure functions and never exposes stored user data.
   */
  Object.defineProperty(window, "__PAOTUNG_TEST__", {
    value: {
      defaultPlan: defaultPlan,
      getBudgetMetrics: getBudgetMetrics,
      parseExpenseQr: parseExpenseQr,
      createDemoExpenses: createDemoExpenses,
      endDateOf: endDateOf
    },
    enumerable: false,
    configurable: false,
    writable: false
  });

  render();
})();

  </script>
</body>
</html>
